<svg xmlns="http://www.w3.org/2000/svg" width="2460" height="2260" viewBox="0 0 2460 2260" role="img" aria-labelledby="title desc">
  <title id="title">Parking lot — UML class diagram</title>
  <desc id="desc">Private parking state, read-only identities, allocation and pricing strategies, panel-coordinated payment, callback displays, and immutable records. Internal checkout holds one shared lot lock.</desc>
  <defs>
    <marker id="open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="1.5" />
    </marker>
    <marker id="triangle" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M1 1 L16 9 L1 17 Z" fill="white" stroke="black" stroke-width="1.5" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <g font-family="DejaVu Sans, sans-serif" fill="black">
    <text x="1230" y="43" font-size="31" fill="black" text-anchor="middle" font-weight="bold">Parking lot — UML class diagram</text>
    <text x="1230" y="79" font-size="21" fill="black" text-anchor="middle">Blue: logic     Green: data/state     Purple: contract</text>
    <text x="1230" y="113" font-size="20" fill="black" text-anchor="middle">Core relationships and selected members · Python privacy is conventional</text>
    <g id="entry">
      <rect x="60" y="150" width="600" height="184" fill="white" stroke="black" stroke-width="2" />
    <text x="360.0" y="188" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">EntryPanel</text>
    <path d="M60 208 H660" fill="none" stroke="black" stroke-width="2" />
    <text x="78" y="238" font-size="20" fill="black" text-anchor="start">- _lot: ParkingLot</text>
    <text x="78" y="268" font-size="20" fill="black" text-anchor="start">- _clock: Clock</text>
    <path d="M60 284 H660" fill="none" stroke="black" stroke-width="2" />
    <text x="78" y="314" font-size="20" fill="black" text-anchor="start">+ park(vehicle, now=None): Ticket</text>
    </g>
    <g id="lot">
      <rect x="900" y="150" width="660" height="394" fill="white" stroke="black" stroke-width="2" />
    <text x="1230.0" y="188" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">ParkingLot</text>
    <path d="M900 208 H1560" fill="none" stroke="black" stroke-width="2" />
    <text x="918" y="238" font-size="20" fill="black" text-anchor="start">- _floors: dict[int, Floor]</text>
    <text x="918" y="268" font-size="20" fill="black" text-anchor="start">- _allocation: AllocationStrategy</text>
    <text x="918" y="298" font-size="20" fill="black" text-anchor="start">- _active: dict[str, Ticket]</text>
    <text x="918" y="328" font-size="20" fill="black" text-anchor="start">- _checking_out: set[str]</text>
    <text x="918" y="358" font-size="20" fill="black" text-anchor="start">- _lock: RLock</text>
    <path d="M900 374 H1560" fill="none" stroke="black" stroke-width="2" />
    <text x="918" y="404" font-size="20" fill="black" text-anchor="start">+ park(vehicle, now): Ticket</text>
    <text x="918" y="434" font-size="20" fill="black" text-anchor="start">+ find_active(ticket_id): Ticket</text>
    <text x="918" y="464" font-size="20" fill="black" text-anchor="start">- _checkout(ticket_id): context manager</text>
    <text x="918" y="494" font-size="20" fill="black" text-anchor="start">- _release(ticket): None</text>
    <text x="918" y="524" font-size="20" fill="black" text-anchor="start">+ free_count / total_count: int {readOnly}</text>
    </g>
    <g id="exit">
      <rect x="1800" y="150" width="600" height="274" fill="white" stroke="black" stroke-width="2" />
    <text x="2100.0" y="188" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">ExitPanel</text>
    <path d="M1800 208 H2400" fill="none" stroke="black" stroke-width="2" />
    <text x="1818" y="238" font-size="20" fill="black" text-anchor="start">- _lot: ParkingLot</text>
    <text x="1818" y="268" font-size="20" fill="black" text-anchor="start">- _pricing: PricingStrategy</text>
    <text x="1818" y="298" font-size="20" fill="black" text-anchor="start">- _payment: PaymentProcessor</text>
    <text x="1818" y="328" font-size="20" fill="black" text-anchor="start">- _clock: Clock</text>
    <path d="M1800 344 H2400" fill="none" stroke="black" stroke-width="2" />
    <text x="1818" y="374" font-size="20" fill="black" text-anchor="start">+ quote(ticket_id, now=None): Decimal</text>
    <text x="1818" y="404" font-size="20" fill="black" text-anchor="start">+ settle(ticket_id, now=None): Receipt</text>
    </g>
    <g id="allocation">
      <rect x="60" y="630" width="600" height="152" fill="white" stroke="black" stroke-width="2" />
    <text x="360.0" y="658" font-size="20" fill="#7435a0" text-anchor="middle">«abstract»</text>
    <text x="360.0" y="696" font-size="25" fill="#7435a0" text-anchor="middle" font-weight="bold">AllocationStrategy</text>
    <path d="M60 716 H660" fill="none" stroke="black" stroke-width="2" />
    <text x="78" y="762" font-size="20" fill="black" text-anchor="start">+ choose(floors, vehicle): Allocation | None</text>
    </g>
    <g id="anyfree">
      <rect x="60" y="900" width="600" height="124" fill="white" stroke="black" stroke-width="2" />
    <text x="360.0" y="938" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">AnyFreeSpotAllocation</text>
    <path d="M60 958 H660" fill="none" stroke="black" stroke-width="2" />
    <text x="78" y="1004" font-size="20" fill="black" text-anchor="start">+ choose(floors, vehicle): Allocation | None</text>
    </g>
    <g id="floor">
      <rect x="900" y="740" width="660" height="364" fill="white" stroke="black" stroke-width="2" />
    <text x="1230.0" y="778" font-size="25" fill="#18713a" text-anchor="middle" font-weight="bold">Floor</text>
    <path d="M900 798 H1560" fill="none" stroke="black" stroke-width="2" />
    <text x="918" y="828" font-size="20" fill="black" text-anchor="start">+ id: int {readOnly}</text>
    <text x="918" y="858" font-size="20" fill="black" text-anchor="start">- _spots: dict[str, Spot]</text>
    <text x="918" y="888" font-size="20" fill="black" text-anchor="start">- _observers: list[Callable[[Floor], None]]</text>
    <text x="918" y="918" font-size="20" fill="black" text-anchor="start">+ free_spots: tuple[Spot, ...] {readOnly}</text>
    <text x="918" y="948" font-size="20" fill="black" text-anchor="start">+ counts: dict[SpotSize, int] {readOnly}</text>
    <path d="M900 964 H1560" fill="none" stroke="black" stroke-width="2" />
    <text x="918" y="994" font-size="20" fill="black" text-anchor="start">+ attach(callback): None</text>
    <text x="918" y="1024" font-size="20" fill="black" text-anchor="start">- _take(spot, vehicle): None</text>
    <text x="918" y="1054" font-size="20" fill="black" text-anchor="start">- _release(spot_id): None</text>
    <text x="918" y="1084" font-size="20" fill="black" text-anchor="start">- _notify(): None</text>
    </g>
    <g id="spot">
      <rect x="900" y="1230" width="660" height="304" fill="white" stroke="black" stroke-width="2" />
    <text x="1230.0" y="1268" font-size="25" fill="#18713a" text-anchor="middle" font-weight="bold">Spot</text>
    <path d="M900 1288 H1560" fill="none" stroke="black" stroke-width="2" />
    <text x="918" y="1318" font-size="20" fill="black" text-anchor="start">+ id: str {readOnly}</text>
    <text x="918" y="1348" font-size="20" fill="black" text-anchor="start">+ size: SpotSize {readOnly}</text>
    <text x="918" y="1378" font-size="20" fill="black" text-anchor="start">- _occupied_by: Vehicle | None</text>
    <text x="918" y="1408" font-size="20" fill="black" text-anchor="start">+ is_free: bool {readOnly}</text>
    <path d="M900 1424 H1560" fill="none" stroke="black" stroke-width="2" />
    <text x="918" y="1454" font-size="20" fill="black" text-anchor="start">+ can_fit(vehicle): bool</text>
    <text x="918" y="1484" font-size="20" fill="black" text-anchor="start">- _occupy(vehicle): None</text>
    <text x="918" y="1514" font-size="20" fill="black" text-anchor="start">- _free(): None</text>
    </g>
    <g id="pricing">
      <rect x="1800" y="650" width="600" height="152" fill="white" stroke="black" stroke-width="2" />
    <text x="2100.0" y="678" font-size="20" fill="#7435a0" text-anchor="middle">«abstract»</text>
    <text x="2100.0" y="716" font-size="25" fill="#7435a0" text-anchor="middle" font-weight="bold">PricingStrategy</text>
    <path d="M1800 736 H2400" fill="none" stroke="black" stroke-width="2" />
    <text x="1818" y="782" font-size="20" fill="black" text-anchor="start">+ price(ticket, exit_time): Decimal</text>
    </g>
    <g id="hourly">
      <rect x="1800" y="920" width="600" height="214" fill="white" stroke="black" stroke-width="2" />
    <text x="2100.0" y="958" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">HourlyPricing</text>
    <path d="M1800 978 H2400" fill="none" stroke="black" stroke-width="2" />
    <text x="1818" y="1008" font-size="20" fill="black" text-anchor="start">- _first_hour: Decimal</text>
    <text x="1818" y="1038" font-size="20" fill="black" text-anchor="start">- _later_hour: Decimal</text>
    <text x="1818" y="1068" font-size="20" fill="black" text-anchor="start">- _grace_minutes: int</text>
    <path d="M1800 1084 H2400" fill="none" stroke="black" stroke-width="2" />
    <text x="1818" y="1114" font-size="20" fill="black" text-anchor="start">+ price(ticket, exit_time): Decimal</text>
    </g>
    <g id="payment">
      <rect x="1800" y="1280" width="600" height="152" fill="white" stroke="black" stroke-width="2" />
    <text x="2100.0" y="1308" font-size="20" fill="#7435a0" text-anchor="middle">«abstract»</text>
    <text x="2100.0" y="1346" font-size="25" fill="#7435a0" text-anchor="middle" font-weight="bold">PaymentProcessor</text>
    <path d="M1800 1366 H2400" fill="none" stroke="black" stroke-width="2" />
    <text x="1818" y="1412" font-size="20" fill="black" text-anchor="start">+ charge(amount, ticket_id, now): Receipt</text>
    </g>
    <g id="cash">
      <rect x="1800" y="1560" width="600" height="124" fill="white" stroke="black" stroke-width="2" />
    <text x="2100.0" y="1598" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">CashPayment</text>
    <path d="M1800 1618 H2400" fill="none" stroke="black" stroke-width="2" />
    <text x="1818" y="1664" font-size="20" fill="black" text-anchor="start">+ charge(amount, ticket_id, now): Receipt</text>
    </g>
    <g id="display">
      <rect x="900" y="1720" width="660" height="214" fill="white" stroke="black" stroke-width="2" />
    <text x="1230.0" y="1758" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">DisplayBoard</text>
    <path d="M900 1778 H1560" fill="none" stroke="black" stroke-width="2" />
    <text x="918" y="1808" font-size="20" fill="black" text-anchor="start">- _floor_id: int</text>
    <text x="918" y="1838" font-size="20" fill="black" text-anchor="start">- _counts: dict[SpotSize, int]</text>
    <path d="M900 1854 H1560" fill="none" stroke="black" stroke-width="2" />
    <text x="918" y="1884" font-size="20" fill="black" text-anchor="start">+ update(floor: Floor): None</text>
    <text x="918" y="1914" font-size="20" fill="black" text-anchor="start">+ render(): str</text>
    </g>
    <g id="ticket">
      <rect x="60" y="1150" width="600" height="286" fill="white" stroke="black" stroke-width="2" />
    <text x="360.0" y="1178" font-size="20" fill="#18713a" text-anchor="middle">«frozen dataclass»</text>
    <text x="360.0" y="1216" font-size="25" fill="#18713a" text-anchor="middle" font-weight="bold">Ticket</text>
    <path d="M60 1236 H660" fill="none" stroke="black" stroke-width="2" />
    <text x="78" y="1266" font-size="20" fill="black" text-anchor="start">+ id: str</text>
    <text x="78" y="1296" font-size="20" fill="black" text-anchor="start">+ spot_id: str</text>
    <text x="78" y="1326" font-size="20" fill="black" text-anchor="start">+ floor_id: int</text>
    <text x="78" y="1356" font-size="20" fill="black" text-anchor="start">+ vehicle: Vehicle</text>
    <text x="78" y="1386" font-size="20" fill="black" text-anchor="start">+ spot_size: SpotSize</text>
    <text x="78" y="1416" font-size="20" fill="black" text-anchor="start">+ entry_time: datetime</text>
    </g>
    <g id="vehicle">
      <rect x="60" y="1570" width="600" height="166" fill="white" stroke="black" stroke-width="2" />
    <text x="360.0" y="1598" font-size="20" fill="#18713a" text-anchor="middle">«frozen dataclass»</text>
    <text x="360.0" y="1636" font-size="25" fill="#18713a" text-anchor="middle" font-weight="bold">Vehicle</text>
    <path d="M60 1656 H660" fill="none" stroke="black" stroke-width="2" />
    <text x="78" y="1686" font-size="20" fill="black" text-anchor="start">+ plate: str</text>
    <text x="78" y="1716" font-size="20" fill="black" text-anchor="start">+ type: VehicleType</text>
    </g>
    <g id="receipt">
      <rect x="60" y="1860" width="600" height="226" fill="white" stroke="black" stroke-width="2" />
    <text x="360.0" y="1888" font-size="20" fill="#18713a" text-anchor="middle">«frozen dataclass»</text>
    <text x="360.0" y="1926" font-size="25" fill="#18713a" text-anchor="middle" font-weight="bold">Receipt</text>
    <path d="M60 1946 H660" fill="none" stroke="black" stroke-width="2" />
    <text x="78" y="1976" font-size="20" fill="black" text-anchor="start">+ ticket_id: str</text>
    <text x="78" y="2006" font-size="20" fill="black" text-anchor="start">+ amount: Decimal</text>
    <text x="78" y="2036" font-size="20" fill="black" text-anchor="start">+ method: str</text>
    <text x="78" y="2066" font-size="20" fill="black" text-anchor="start">+ paid_at: datetime</text>
    </g>
    <path d="M660 230 H900" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)" />
    <text x="780" y="214" font-size="19" fill="black" text-anchor="middle">uses · 1</text>
    <path d="M1800 230 H1560" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)" />
    <text x="1680" y="214" font-size="19" fill="black" text-anchor="middle">uses · 1</text>
    <path d="M900 430 H740 V710 H660" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)" />
    <text x="750" y="605" font-size="19" fill="black" text-anchor="start">allocation · 1</text>
    <path d="M2100 424 V650" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)" />
    <text x="2120" y="535" font-size="19" fill="black" text-anchor="start">pricing · 1</text>
    <path d="M2400 310 H2430 V1360 H2400" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)" />
    <text x="2420" y="1180" font-size="19" fill="black" text-anchor="end">payment · 1</text>
    <path d="M1230 544 l12 12 l-12 12 l-12 -12 Z" fill="black" stroke="black" stroke-width="2" />
    <path d="M1230 568 V740" fill="none" stroke="black" stroke-width="2" />
    <text x="1254" y="589" font-size="18" fill="black" text-anchor="start">1</text>
    <text x="1254" y="728" font-size="18" fill="black" text-anchor="start">0..*</text>
    <text x="1255" y="652.0" font-size="19" fill="black" text-anchor="start">owns floors</text>
    <path d="M1230 1104 l12 12 l-12 12 l-12 -12 Z" fill="black" stroke="black" stroke-width="2" />
    <path d="M1230 1128 V1230" fill="none" stroke="black" stroke-width="2" />
    <text x="1254" y="1149" font-size="18" fill="black" text-anchor="start">1</text>
    <text x="1254" y="1218" font-size="18" fill="black" text-anchor="start">0..*</text>
    <text x="1255" y="1177.0" font-size="19" fill="black" text-anchor="start">owns spots</text>
    <path d="M360 900 V782" fill="none" stroke="black" stroke-width="2" marker-end="url(#triangle)" />
    <text x="382" y="850" font-size="19" fill="black" text-anchor="start">inherits</text>
    <path d="M2100 920 V802" fill="none" stroke="black" stroke-width="2" marker-end="url(#triangle)" />
    <text x="2122" y="870" font-size="19" fill="black" text-anchor="start">inherits</text>
    <path d="M2100 1560 V1432" fill="none" stroke="black" stroke-width="2" marker-end="url(#triangle)" />
    <text x="2122" y="1510" font-size="19" fill="black" text-anchor="start">inherits</text>
    <path d="M360 1436 V1570" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)" />
    <text x="380" y="1510" font-size="19" fill="black" text-anchor="start">vehicle · 1</text>
    <path d="M900 1420 H760 V1640 H660" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)" />
    <text x="680" y="1610" font-size="18" fill="black" text-anchor="start">0..1</text>
    <path d="M1560 1800 H1660 V990 H1560" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)" />
    <text x="1640" y="1180" font-size="19" fill="black" text-anchor="end">registers update()</text>
    <text x="1640" y="1208" font-size="18" fill="black" text-anchor="end">«construction dependency»</text>
    <path d="M900 1990 H2375 L2400 2015 V2190 H900 Z M2375 1990 V2015 H2400" fill="white" stroke="black" stroke-width="2" />
    <text x="925" y="2028" font-size="23" fill="black" text-anchor="start" font-weight="bold">Ownership, callbacks, and checkout</text>
    <text x="925" y="2063" font-size="20" fill="black" text-anchor="start">ExitPanel prices and charges inside lot._checkout(); a successful block permits release.</text>
    <text x="925" y="2098" font-size="20" fill="black" text-anchor="start">Floor stores board.update callbacks; committed state is published and callback failures are logged.</text>
    <text x="925" y="2133" font-size="20" fill="black" text-anchor="start">Aware UTC times; fixed floors/spots; one active stay per plate; one lot lock; simulated cash.</text>
    <text x="925" y="2168" font-size="20" fill="black" text-anchor="start">Allocation = (Floor, Spot). Clock = callable returning datetime. Other data links appear in signatures.</text>
    <path d="M1230 1934 V1990" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" />
    <text x="1230" y="2230" font-size="19" fill="black" text-anchor="middle">Open V: association/dependency · Hollow triangle: inheritance · Filled diamond: composition · Dashed: dependency/note</text>
  </g>
</svg>

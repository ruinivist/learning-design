<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 600" role="img" aria-labelledby="title desc">
  <title id="title">Displays: observe availability</title>
  <desc id="desc">DisplayBoard registers its update callback with one floor and pulls counts from it. Floor stores callbacks and invokes them after the lot commits occupancy and ticket state.</desc>
  <defs>
    <marker id="open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="2" />
    </marker>
    <marker id="triangle" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L18 10 L1 19 Z" fill="white" stroke="black" stroke-width="2" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <g font-family="DejaVu Sans, sans-serif" fill="black">
    <text x="710" y="43" font-size="31" fill="black" text-anchor="middle" font-weight="bold">Displays: observe availability</text>
    <text x="710" y="79" font-size="20" fill="black" text-anchor="middle">Blue: logic     Green: data/state     Purple: contract</text>
    <g id="Floor">
      <rect x="60" y="140" width="670" height="218" fill="white" stroke="black" stroke-width="2" />
    <text x="395" y="173" font-size="25" fill="#18713a" text-anchor="middle" font-weight="bold">Floor</text>
    <path d="M60 190 H730" fill="none" stroke="black" stroke-width="2" />
    <text x="78" y="223" font-size="20" fill="black" text-anchor="start">- _observers: list[Callable[[Floor], None]]</text>
    <text x="78" y="253" font-size="20" fill="black" text-anchor="start">+ counts: dict[SpotSize, int] {readOnly}</text>
    <path d="M60 274 H730" fill="none" stroke="black" stroke-width="2" />
    <text x="78" y="307" font-size="20" fill="black" text-anchor="start">+ attach(callback: Callable[[Floor], None]): None</text>
    <text x="78" y="337" font-size="20" fill="black" text-anchor="start">- _notify(): None</text>
    </g>
    <g id="DisplayBoard">
      <rect x="920" y="140" width="440" height="218" fill="white" stroke="black" stroke-width="2" />
    <text x="1140" y="173" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">DisplayBoard</text>
    <path d="M920 190 H1360" fill="none" stroke="black" stroke-width="2" />
    <text x="938" y="223" font-size="20" fill="black" text-anchor="start">- _floor_id: int</text>
    <text x="938" y="253" font-size="20" fill="black" text-anchor="start">- _counts: dict[SpotSize, int]</text>
    <path d="M920 274 H1360" fill="none" stroke="black" stroke-width="2" />
    <text x="938" y="307" font-size="20" fill="black" text-anchor="start">+ update(floor: Floor): None</text>
    <text x="938" y="337" font-size="20" fill="black" text-anchor="start">+ render(): str</text>
    </g>
    <path d="M920 250 H730" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)" />
    <text x="825" y="231" font-size="18" fill="black" text-anchor="middle">attach / pull counts</text>
    <path d="M395 358 V440" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" />
    <path d="M60 440 H1340 L1360 460 V524 H60 Z M1340 440 V460 H1360" fill="white" stroke="black" stroke-width="2" />
    <text x="78" y="473" font-size="20" fill="black" text-anchor="start">Floor stores board.update callbacks. After commit, _notify() invokes each callback with the floor.</text>
    <text x="78" y="503" font-size="20" fill="black" text-anchor="start">update(floor) copies floor.counts into the board. The board also pulls a snapshot at construction.</text>
    <text x="710" y="575" font-size="18" fill="black" text-anchor="middle">Dashed arrow: dependency     Dashed line to folded corner: note</text>
  </g>
</svg>

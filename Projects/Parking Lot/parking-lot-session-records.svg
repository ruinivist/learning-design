<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 460" role="img" aria-labelledby="title desc">
  <title id="title">Sessions: immutable records</title>
  <desc id="desc">Ticket stores the assignment and entry snapshot. Receipt records payment for a ticket. Every field shown is read-only.</desc>
  <defs>
    <marker id="open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="2" />
    </marker>
    <marker id="triangle" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L18 10 L1 19 Z" fill="white" stroke="black" stroke-width="2" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <g font-family="DejaVu Sans, sans-serif" fill="black">
    <text x="675" y="43" font-size="31" fill="black" text-anchor="middle" font-weight="bold">Sessions: immutable records</text>
    <text x="675" y="79" font-size="20" fill="black" text-anchor="middle">Blue: logic     Green: data/state     Purple: contract</text>
    <g id="Ticket">
      <rect x="60" y="140" width="650" height="254" fill="white" stroke="black" stroke-width="2" />
    <text x="385" y="173" font-size="25" fill="#18713a" text-anchor="middle" font-weight="bold">Ticket</text>
    <path d="M60 190 H710" fill="none" stroke="black" stroke-width="2" />
    <text x="78" y="223" font-size="20" fill="black" text-anchor="start">+ id: str {readOnly}</text>
    <text x="78" y="253" font-size="20" fill="black" text-anchor="start">+ floor_id: int {readOnly}</text>
    <text x="78" y="283" font-size="20" fill="black" text-anchor="start">+ spot_id: int {readOnly}</text>
    <text x="78" y="313" font-size="20" fill="black" text-anchor="start">+ vehicle: Vehicle {readOnly}</text>
    <text x="78" y="343" font-size="20" fill="black" text-anchor="start">+ spot_size: SpotSize {readOnly}</text>
    <text x="78" y="373" font-size="20" fill="black" text-anchor="start">+ entry_time: datetime {readOnly}</text>
    </g>
    <g id="Receipt">
      <rect x="800" y="140" width="490" height="194" fill="white" stroke="black" stroke-width="2" />
    <text x="1045" y="173" font-size="25" fill="#18713a" text-anchor="middle" font-weight="bold">Receipt</text>
    <path d="M800 190 H1290" fill="none" stroke="black" stroke-width="2" />
    <text x="818" y="223" font-size="20" fill="black" text-anchor="start">+ ticket_id: str {readOnly}</text>
    <text x="818" y="253" font-size="20" fill="black" text-anchor="start">+ amount: Decimal {readOnly}</text>
    <text x="818" y="283" font-size="20" fill="black" text-anchor="start">+ paid_at: datetime {readOnly}</text>
    <text x="818" y="313" font-size="20" fill="black" text-anchor="start">+ method: str {readOnly}</text>
    </g>
  </g>
</svg>

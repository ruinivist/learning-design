<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1640" viewBox="0 0 1760 1640" role="img" aria-labelledby="title desc">
<title id="title">Vending machine: sale and internal dispensing</title><desc id="desc">After a 200-cent insertion, HasMoney asks Machine to sell 140-cent tea. The local change search returns three twenties before stock and cash are committed. HasMoney installs Dispensing and returns change to Machine.select. Machine calls dispense internally, which checks stock and installs Idle or SoldOut, then returns change to the caller. Refused sales preserve all state and skip dispensing.</desc>
<defs>
<marker id="open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="1.5"/></marker>
<marker id="filled" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12 Z" fill="black" stroke="black" stroke-width="1"/></marker>
<marker id="triangle" markerWidth="17" markerHeight="17" refX="15" refY="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="white" stroke="black" stroke-width="1.3"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="black">
<text x="880.0" y="43" font-size="31" fill="black" text-anchor="middle" font-weight="bold">Vending machine: sale and internal dispensing</text>
<text x="880.0" y="80" font-size="20" fill="black" text-anchor="middle">Blue: logic     Green: data     Purple: event contract</text>
<path d="M120 190 V1560" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<path d="M550 190 V1560" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<path d="M1050 190 V1140" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<path d="M1500 1000 V1560" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<rect x="542" y="230" width="16" height="1280" fill="white" stroke="black" stroke-width="2"/>
<rect x="558" y="350" width="16" height="550" fill="white" stroke="black" stroke-width="2"/>
<rect x="574" y="610" width="16" height="70" fill="white" stroke="black" stroke-width="2"/>
<rect x="1042" y="290" width="16" height="810" fill="white" stroke="black" stroke-width="2"/>
<rect x="558" y="1250" width="16" height="50" fill="white" stroke="black" stroke-width="2"/>
<rect x="1492" y="1190" width="16" height="260" fill="white" stroke="black" stroke-width="2"/>
<rect x="30.0" y="130" width="180" height="60" fill="white" stroke="black" stroke-width="2"/><text x="120" y="168" font-size="24" fill="#1856a6" text-anchor="middle" font-weight="bold">Caller</text>
<rect x="400.0" y="130" width="300" height="60" fill="white" stroke="black" stroke-width="2"/><text x="550" y="168" font-size="24" fill="#1856a6" text-anchor="middle" font-weight="bold">machine: Machine</text>
<rect x="925.0" y="130" width="250" height="60" fill="white" stroke="black" stroke-width="2"/><text x="1050" y="168" font-size="24" fill="#1856a6" text-anchor="middle" font-weight="bold">paid: HasMoney</text>
<rect x="1350.0" y="940" width="300" height="60" fill="white" stroke="black" stroke-width="2"/><text x="1500" y="978" font-size="24" fill="#1856a6" text-anchor="middle" font-weight="bold">out: Dispensing</text>
<path d="M120 230 H542" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)"/><text x="331.0" y="218" font-size="20" fill="black" text-anchor="middle">select(&quot;tea&quot;)</text>
<path d="M558 290 H1042" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)"/><text x="800.0" y="278" font-size="20" fill="black" text-anchor="middle">select(machine, &quot;tea&quot;)</text>
<path d="M1042 350 H574" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)"/><text x="808.0" y="338" font-size="20" fill="black" text-anchor="middle">_sell(&quot;tea&quot;)</text>
<g><path d="M185 400 H485 L505 420 V492 H185 Z M485 400 V420 H505" fill="white" stroke="black" stroke-width="2"/><text x="205" y="435" font-size="20" fill="black" text-anchor="start">Pool held coins.</text><text x="205" y="465" font-size="20" fill="black" text-anchor="start">Check item, stock, funds.</text></g>
<g><path d="M1140 360 H1680 L1700 380 V512 H1140 Z M1680 360 V380 H1700" fill="white" stroke="black" stroke-width="2"/><text x="1160" y="395" font-size="20" fill="black" text-anchor="start">Any failed check or missing change:</text><text x="1160" y="425" font-size="20" fill="black" text-anchor="start">raise SaleRefused; keep stock,</text><text x="1160" y="455" font-size="20" fill="black" text-anchor="start">stored cash, payment, and state.</text><text x="1160" y="485" font-size="20" fill="black" text-anchor="start">No sale is committed.</text></g>
<path d="M574 550 H900 V610 H590" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)"/>
<text x="625" y="537" font-size="20" fill="black" text-anchor="start">make_change(60) {local}</text>
<path d="M590 680 H900 V725 H574" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/>
<text x="625" y="710" font-size="20" fill="black" text-anchor="start">change = {20: 3}</text>
<g><path d="M160 755 H485 L505 775 V877 H160 Z M485 755 V775 H505" fill="white" stroke="black" stroke-width="2"/><text x="180" y="790" font-size="20" fill="black" text-anchor="start">item.count -= 1</text><text x="180" y="820" font-size="20" fill="black" text-anchor="start">_coins = available − change</text><text x="180" y="850" font-size="20" fill="black" text-anchor="start">_inserted.clear()</text></g>
<path d="M574 900 H1042" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="808.0" y="888" font-size="20" fill="black" text-anchor="middle">change: Counter({20: 3})</text>
<path d="M1058 970 H1350" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)"/><text x="1204.0" y="958" font-size="20" fill="black" text-anchor="middle">«create» Dispensing()</text>
<g><path d="M650 1000 H980 L1000 1020 V1062 H650 Z M980 1000 V1020 H1000" fill="white" stroke="black" stroke-width="2"/><text x="670" y="1035" font-size="20" fill="black" text-anchor="start">_state = new Dispensing</text></g>
<path d="M1042 1100 H558" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="800.0" y="1088" font-size="20" fill="black" text-anchor="middle">change</text>
<path d="M558 1190 H1492" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)"/><text x="1025.0" y="1178" font-size="20" fill="black" text-anchor="middle">dispense(machine)</text>
<path d="M1492 1250 H574" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)"/><text x="1033.0" y="1238" font-size="20" fill="black" text-anchor="middle">_has_stock()</text>
<path d="M574 1300 H1492" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="1033.0" y="1288" font-size="20" fill="black" text-anchor="middle">True</text>
<g><path d="M630 1320 H1260 L1280 1340 V1412 H630 Z M1260 1320 V1340 H1280" fill="white" stroke="black" stroke-width="2"/><text x="650" y="1355" font-size="20" fill="black" text-anchor="start">Dispensing installs Idle if stock remains,</text><text x="650" y="1385" font-size="20" fill="black" text-anchor="start">otherwise SoldOut.</text></g>
<path d="M1492 1450 H558" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="1025.0" y="1438" font-size="20" fill="black" text-anchor="middle">None</text>
<path d="M542 1510 H120" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="331.0" y="1498" font-size="20" fill="black" text-anchor="middle">change: Counter({20: 3})</text>
<text x="880.0" y="1616" font-size="18" fill="black" text-anchor="middle">Solid filled head: synchronous call · Dashed open head: reply · {local}: nested function · All money is cents</text>
</g>
</svg>

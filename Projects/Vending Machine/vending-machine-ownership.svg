<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="745" viewBox="0 0 1440 745" role="img" aria-labelledby="title desc">
<title id="title">Vending machine: ownership</title><desc id="desc">Machine owns copies of Item records and separates stored cash from inserted payment. All amounts are integer cents.</desc>
<defs>
<marker id="open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="1.5"/></marker>
<marker id="filled" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12 Z" fill="black" stroke="black" stroke-width="1"/></marker>
<marker id="triangle" markerWidth="17" markerHeight="17" refX="15" refY="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="white" stroke="black" stroke-width="1.3"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="black">
<text x="720.0" y="43" font-size="31" fill="black" text-anchor="middle" font-weight="bold">Vending machine: ownership</text>
<text x="720.0" y="80" font-size="20" fill="black" text-anchor="middle">Blue: logic     Green: data     Purple: event contract</text>
<g><rect x="60" y="145" width="710" height="246" fill="white" stroke="black" stroke-width="2"/><text x="415.0" y="180" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">Machine</text><path d="M60 197 H770" fill="none" stroke="black" stroke-width="2"/><text x="78" y="227" font-size="20" fill="black" text-anchor="start">− _items: dict[str, Item]</text><text x="78" y="257" font-size="20" fill="black" text-anchor="start">− _coins: Counter[int]</text><text x="78" y="287" font-size="20" fill="black" text-anchor="start">− _inserted: Counter[int]</text><text x="78" y="317" font-size="20" fill="black" text-anchor="start">+ balance_cents: int {readOnly}</text><path d="M60 339 H770" fill="none" stroke="black" stroke-width="2"/><text x="78" y="369" font-size="20" fill="black" text-anchor="start">+ __init__(items, coins)</text></g>
<g><rect x="975" y="155" width="405" height="216" fill="white" stroke="black" stroke-width="2"/><text x="1177.5" y="190" font-size="25" fill="#18713a" text-anchor="middle" font-weight="bold">Item</text><path d="M975 207 H1380" fill="none" stroke="black" stroke-width="2"/><text x="993" y="237" font-size="20" fill="black" text-anchor="start">+ name: str</text><text x="993" y="267" font-size="20" fill="black" text-anchor="start">+ price_cents: int</text><text x="993" y="297" font-size="20" fill="black" text-anchor="start">+ count: int</text><path d="M975 319 H1380" fill="none" stroke="black" stroke-width="2"/><text x="993" y="349" font-size="20" fill="black" text-anchor="start">+ __post_init__(): None</text></g>
<polygon points="770,250 783,241 796,250 783,259" fill="black" stroke="black" stroke-width="2"/><path d="M796 250 H975" fill="none" stroke="black" stroke-width="2"/><text x="872.5" y="228" font-size="19" fill="black" text-anchor="middle">_items[name]</text><text x="806" y="277" font-size="18" fill="black" text-anchor="start">1</text><text x="959" y="277" font-size="18" fill="black" text-anchor="end">0..*</text>
<g><path d="M60 510 H1360 L1380 530 V667 H60 Z M1360 510 V530 H1380" fill="white" stroke="black" stroke-width="2"/><text x="80" y="545" font-size="23" fill="black" text-anchor="start" font-weight="bold">Keep ownership and money separate</text><text x="80" y="580" font-size="20" fill="black" text-anchor="start">The constructor copies each Item and the coin mapping. Incoming objects cannot mutate owned inventory.</text><text x="80" y="610" font-size="20" fill="black" text-anchor="start">_coins holds stored cash. _inserted holds refundable payment; balance_cents sums only that payment.</text><text x="80" y="640" font-size="20" fill="black" text-anchor="start">Validate names, integer prices and counts, supported coins, and unique item names at construction.</text></g>
<path d="M410 510 V391" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<text x="720.0" y="721" font-size="18" fill="black" text-anchor="middle">Filled diamond at Machine: composition · 1 machine owns 0..* items · Selected members</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1240" viewBox="0 0 1760 1240" role="img" aria-labelledby="title desc">
<title id="title">Vending machine: event permissions and states</title><desc id="desc">Machine delegates to a concrete State base whose default methods reject events. Idle, HasMoney, Dispensing, and SoldOut override only legal events and transition after successful operations.</desc>
<defs>
<marker id="open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="1.5"/></marker>
<marker id="filled" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12 Z" fill="black" stroke="black" stroke-width="1"/></marker>
<marker id="triangle" markerWidth="17" markerHeight="17" refX="15" refY="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="white" stroke="black" stroke-width="1.3"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="black">
<text x="880.0" y="43" font-size="31" fill="black" text-anchor="middle" font-weight="bold">Vending machine: event permissions and states</text>
<text x="880.0" y="80" font-size="20" fill="black" text-anchor="middle">Blue: logic     Green: data     Purple: event contract</text>
<g><rect x="60" y="140" width="620" height="246" fill="white" stroke="black" stroke-width="2"/><text x="370.0" y="175" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">Machine</text><path d="M60 192 H680" fill="none" stroke="black" stroke-width="2"/><text x="78" y="222" font-size="20" fill="black" text-anchor="start">− _state: State</text><path d="M60 244 H680" fill="none" stroke="black" stroke-width="2"/><text x="78" y="274" font-size="20" fill="black" text-anchor="start">+ insert(coin)</text><text x="78" y="304" font-size="20" fill="black" text-anchor="start">+ select(name)</text><text x="78" y="334" font-size="20" fill="black" text-anchor="start">+ cancel()</text><text x="78" y="364" font-size="20" fill="black" text-anchor="start">+ restock(name, count)</text></g>
<g><rect x="960" y="140" width="740" height="224" fill="white" stroke="black" stroke-width="2"/><text x="1330.0" y="175" font-size="25" fill="#7435a0" text-anchor="middle" font-weight="bold">State</text><path d="M960 192 H1700" fill="none" stroke="black" stroke-width="2"/><text x="978" y="222" font-size="20" fill="black" text-anchor="start">+ insert(m, coin)</text><text x="978" y="252" font-size="20" fill="black" text-anchor="start">+ select(m, name)</text><text x="978" y="282" font-size="20" fill="black" text-anchor="start">+ cancel(m)</text><text x="978" y="312" font-size="20" fill="black" text-anchor="start">+ dispense(m)</text><text x="978" y="342" font-size="20" fill="black" text-anchor="start">+ restock(m, name, count)</text></g>
<path d="M680 300 H960" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)"/>
<text x="820" y="275" font-size="19" fill="black" text-anchor="middle">delegates events</text>
<text x="936" y="330" font-size="18" fill="black" text-anchor="start">1</text>
<g><rect x="60" y="765" width="340" height="134" fill="white" stroke="black" stroke-width="2"/><text x="230.0" y="800" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">Idle</text><path d="M60 817 H400" fill="none" stroke="black" stroke-width="2"/><text x="78" y="847" font-size="20" fill="black" text-anchor="start">+ insert(m, coin)</text><text x="78" y="877" font-size="20" fill="black" text-anchor="start">+ restock(m, name, count)</text></g>
<path d="M230.0 765 V680" fill="none" stroke="black" stroke-width="2"/>
<g><rect x="480" y="765" width="340" height="164" fill="white" stroke="black" stroke-width="2"/><text x="650.0" y="800" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">HasMoney</text><path d="M480 817 H820" fill="none" stroke="black" stroke-width="2"/><text x="498" y="847" font-size="20" fill="black" text-anchor="start">+ insert(m, coin)</text><text x="498" y="877" font-size="20" fill="black" text-anchor="start">+ select(m, name)</text><text x="498" y="907" font-size="20" fill="black" text-anchor="start">+ cancel(m)</text></g>
<path d="M650.0 765 V680" fill="none" stroke="black" stroke-width="2"/>
<g><rect x="900" y="765" width="340" height="104" fill="white" stroke="black" stroke-width="2"/><text x="1070.0" y="800" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">Dispensing</text><path d="M900 817 H1240" fill="none" stroke="black" stroke-width="2"/><text x="918" y="847" font-size="20" fill="black" text-anchor="start">+ dispense(m)</text></g>
<path d="M1070.0 765 V680" fill="none" stroke="black" stroke-width="2"/>
<g><rect x="1320" y="765" width="380" height="104" fill="white" stroke="black" stroke-width="2"/><text x="1510.0" y="800" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">SoldOut</text><path d="M1320 817 H1700" fill="none" stroke="black" stroke-width="2"/><text x="1338" y="847" font-size="20" fill="black" text-anchor="start">+ restock(m, name, count)</text></g>
<path d="M1510.0 765 V680" fill="none" stroke="black" stroke-width="2"/>
<path d="M230 680 H1510" fill="none" stroke="black" stroke-width="2"/>
<path d="M1330 680 V364" fill="none" stroke="black" stroke-width="2" marker-end="url(#triangle)"/>
<g><path d="M60 475 H800 L820 495 V662 H60 Z M800 475 V495 H820" fill="white" stroke="black" stroke-width="2"/><text x="80" y="510" font-size="23" fill="black" text-anchor="start" font-weight="bold">Legal events only</text><text x="80" y="545" font-size="20" fill="black" text-anchor="start">State is concrete; default events raise IllegalActionError.</text><text x="80" y="575" font-size="20" fill="black" text-anchor="start">Initial state: Idle if any stock remains, otherwise SoldOut.</text><text x="80" y="605" font-size="20" fill="black" text-anchor="start">Change state only after the machine operation succeeds.</text><text x="80" y="635" font-size="20" fill="black" text-anchor="start">Machine.select() drives dispense() before returning.</text></g>
<path d="M820 540 H900 V350 H960" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<g><path d="M60 1000 H1680 L1700 1020 V1187 H60 Z M1680 1000 V1020 H1700" fill="white" stroke="black" stroke-width="2"/><text x="80" y="1035" font-size="23" fill="black" text-anchor="start" font-weight="bold">Transitions after successful operations</text><text x="80" y="1070" font-size="20" fill="black" text-anchor="start">Idle.insert(): HasMoney. HasMoney.cancel(): Idle. HasMoney.select(): Dispensing.</text><text x="80" y="1100" font-size="20" fill="black" text-anchor="start">Dispensing.dispense(): Idle if stock remains, otherwise SoldOut. SoldOut.restock(): Idle.</text><text x="80" y="1130" font-size="20" fill="black" text-anchor="start">HasMoney.insert() and Idle.restock() keep the current state. Other events are rejected.</text><text x="80" y="1160" font-size="20" fill="black" text-anchor="start">Machine.select() calls dispense() internally; callers make no separate completion call.</text></g>
<text x="880.0" y="1216" font-size="18" fill="black" text-anchor="middle">Open arrow: navigable association · Hollow triangle points to State · Selected members</text>
</g>
</svg>

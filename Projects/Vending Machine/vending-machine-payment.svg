<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1420" viewBox="0 0 1740 1420" role="img" aria-labelledby="title desc">
<title id="title">Vending machine: insertion and cancellation</title><desc id="desc">Idle accepts a 100-cent coin into the separate payment and installs a new HasMoney state. Cancellation detaches the payment as a refund and installs a new Idle state. Stored cash is unchanged. The old Idle lifeline ends after its shown interaction.</desc>
<defs>
<marker id="open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="1.5"/></marker>
<marker id="filled" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12 Z" fill="black" stroke="black" stroke-width="1"/></marker>
<marker id="triangle" markerWidth="17" markerHeight="17" refX="15" refY="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="white" stroke="black" stroke-width="1.3"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="black">
<text x="870.0" y="43" font-size="31" fill="black" text-anchor="middle" font-weight="bold">Vending machine: insertion and cancellation</text>
<text x="870.0" y="80" font-size="20" fill="black" text-anchor="middle">Blue: logic     Green: data     Purple: event contract</text>
<path d="M130 190 V1330" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<path d="M550 190 V1330" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<path d="M1000 190 V670" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<path d="M1450 540 V1330" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<rect x="542" y="230" width="16" height="440" fill="white" stroke="black" stroke-width="2"/>
<rect x="558" y="360" width="16" height="70" fill="white" stroke="black" stroke-width="2"/>
<rect x="992" y="300" width="16" height="320" fill="white" stroke="black" stroke-width="2"/>
<rect x="542" y="730" width="16" height="520" fill="white" stroke="black" stroke-width="2"/>
<rect x="558" y="860" width="16" height="210" fill="white" stroke="black" stroke-width="2"/>
<rect x="1442" y="800" width="16" height="400" fill="white" stroke="black" stroke-width="2"/>
<rect x="40.0" y="130" width="180" height="60" fill="white" stroke="black" stroke-width="2"/><text x="130" y="168" font-size="24" fill="#1856a6" text-anchor="middle" font-weight="bold">Caller</text>
<rect x="400.0" y="130" width="300" height="60" fill="white" stroke="black" stroke-width="2"/><text x="550" y="168" font-size="24" fill="#1856a6" text-anchor="middle" font-weight="bold">machine: Machine</text>
<rect x="875.0" y="130" width="250" height="60" fill="white" stroke="black" stroke-width="2"/><text x="1000" y="168" font-size="24" fill="#1856a6" text-anchor="middle" font-weight="bold">idle: Idle</text>
<rect x="1325.0" y="480" width="250" height="60" fill="white" stroke="black" stroke-width="2"/><text x="1450" y="518" font-size="24" fill="#1856a6" text-anchor="middle" font-weight="bold">paid: HasMoney</text>
<path d="M130 230 H542" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)"/><text x="336.0" y="218" font-size="20" fill="black" text-anchor="middle">insert(100)</text>
<path d="M558 300 H992" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)"/><text x="775.0" y="288" font-size="20" fill="black" text-anchor="middle">insert(machine, 100)</text>
<path d="M992 360 H574" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)"/><text x="783.0" y="348" font-size="20" fill="black" text-anchor="middle">_accept(100)</text>
<path d="M574 430 H992" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="783.0" y="418" font-size="20" fill="black" text-anchor="middle">None</text>
<path d="M1008 510 H1325" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)"/><text x="1166.5" y="498" font-size="20" fill="black" text-anchor="middle">«create» HasMoney()</text>
<g><path d="M620 465 H950 L970 485 V587 H620 Z M950 465 V485 H970" fill="white" stroke="black" stroke-width="2"/><text x="640" y="500" font-size="20" fill="black" text-anchor="start">_inserted = {100: 1}</text><text x="640" y="530" font-size="20" fill="black" text-anchor="start">_coins unchanged</text><text x="640" y="560" font-size="20" fill="black" text-anchor="start">_state = new HasMoney</text></g>
<path d="M992 620 H558" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="775.0" y="608" font-size="20" fill="black" text-anchor="middle">None</text>
<path d="M542 670 H130" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="336.0" y="658" font-size="20" fill="black" text-anchor="middle">None</text>
<path d="M130 730 H542" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)"/><text x="336.0" y="718" font-size="20" fill="black" text-anchor="middle">cancel()</text>
<path d="M558 800 H1442" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)"/><text x="1000.0" y="788" font-size="20" fill="black" text-anchor="middle">cancel(machine)</text>
<path d="M1442 860 H574" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)"/><text x="1008.0" y="848" font-size="20" fill="black" text-anchor="middle">_refund()</text>
<g><path d="M620 885 H950 L970 905 V1007 H620 Z M950 885 V905 H970" fill="white" stroke="black" stroke-width="2"/><text x="640" y="920" font-size="20" fill="black" text-anchor="start">Detach payment as refund.</text><text x="640" y="950" font-size="20" fill="black" text-anchor="start">_inserted = Counter()</text><text x="640" y="980" font-size="20" fill="black" text-anchor="start">_coins unchanged</text></g>
<path d="M574 1070 H1442" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="1008.0" y="1058" font-size="20" fill="black" text-anchor="middle">refund: Counter({100: 1})</text>
<g><path d="M650 1100 H1230 L1250 1120 V1162 H650 Z M1230 1100 V1120 H1250" fill="white" stroke="black" stroke-width="2"/><text x="670" y="1135" font-size="20" fill="black" text-anchor="start">HasMoney installs a new Idle as _state.</text></g>
<path d="M1442 1200 H558" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="1000.0" y="1188" font-size="20" fill="black" text-anchor="middle">refund</text>
<path d="M542 1250 H130" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="336.0" y="1238" font-size="20" fill="black" text-anchor="middle">refund: Counter({100: 1})</text>
<text x="870.0" y="1396" font-size="18" fill="black" text-anchor="middle">Solid filled head: synchronous call · Dashed open head: reply · Creation targets a new participant · All money is cents</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1555" viewBox="0 0 1760 1555" role="img" aria-labelledby="title desc">
<title id="title">Vending machine: UML class diagram</title><desc id="desc">Machine owns copied Item records and separate stored cash and payment. Its concrete State base rejects illegal events. Four subclasses control transitions. Selection commits and completes internal dispensing before returning change; calls must be sequential.</desc>
<defs>
<marker id="open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="1.5"/></marker>
<marker id="filled" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12 Z" fill="black" stroke="black" stroke-width="1"/></marker>
<marker id="triangle" markerWidth="17" markerHeight="17" refX="15" refY="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="white" stroke="black" stroke-width="1.3"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="black">
<text x="880.0" y="43" font-size="31" fill="black" text-anchor="middle" font-weight="bold">Vending machine: UML class diagram</text>
<text x="880.0" y="80" font-size="20" fill="black" text-anchor="middle">Blue: logic     Green: data     Purple: event contract</text>
<g><rect x="60" y="130" width="850" height="366" fill="white" stroke="black" stroke-width="2"/><text x="485.0" y="165" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">Machine</text><path d="M60 182 H910" fill="none" stroke="black" stroke-width="2"/><text x="78" y="212" font-size="20" fill="black" text-anchor="start">− _items: dict[str, Item]</text><text x="78" y="242" font-size="20" fill="black" text-anchor="start">− _coins: Counter[int]</text><text x="78" y="272" font-size="20" fill="black" text-anchor="start">− _inserted: Counter[int]</text><text x="78" y="302" font-size="20" fill="black" text-anchor="start">− _state: State</text><text x="78" y="332" font-size="20" fill="black" text-anchor="start">+ balance_cents: int {readOnly}</text><path d="M60 354 H910" fill="none" stroke="black" stroke-width="2"/><text x="78" y="384" font-size="20" fill="black" text-anchor="start">+ insert(coin: int): None</text><text x="78" y="414" font-size="20" fill="black" text-anchor="start">+ select(name: str): Counter[int]</text><text x="78" y="444" font-size="20" fill="black" text-anchor="start">+ cancel(): Counter[int]</text><text x="78" y="474" font-size="20" fill="black" text-anchor="start">+ restock(name: str, count: int): None</text></g>
<g><rect x="1210" y="155" width="480" height="164" fill="white" stroke="black" stroke-width="2"/><text x="1450.0" y="190" font-size="25" fill="#18713a" text-anchor="middle" font-weight="bold">Item</text><path d="M1210 207 H1690" fill="none" stroke="black" stroke-width="2"/><text x="1228" y="237" font-size="20" fill="black" text-anchor="start">+ name: str</text><text x="1228" y="267" font-size="20" fill="black" text-anchor="start">+ price_cents: int</text><text x="1228" y="297" font-size="20" fill="black" text-anchor="start">+ count: int</text></g>
<g><rect x="60" y="735" width="850" height="224" fill="white" stroke="black" stroke-width="2"/><text x="485.0" y="770" font-size="25" fill="#7435a0" text-anchor="middle" font-weight="bold">State</text><path d="M60 787 H910" fill="none" stroke="black" stroke-width="2"/><text x="78" y="817" font-size="20" fill="black" text-anchor="start">+ insert(m: Machine, coin: int): None</text><text x="78" y="847" font-size="20" fill="black" text-anchor="start">+ select(m: Machine, name: str): Counter[int]</text><text x="78" y="877" font-size="20" fill="black" text-anchor="start">+ cancel(m: Machine): Counter[int]</text><text x="78" y="907" font-size="20" fill="black" text-anchor="start">+ dispense(m: Machine): None</text><text x="78" y="937" font-size="20" fill="black" text-anchor="start">+ restock(m: Machine, name: str, count: int): None</text></g>
<polygon points="910,245 923,236 936,245 923,254" fill="black" stroke="black" stroke-width="2"/><path d="M936 245 H1210" fill="none" stroke="black" stroke-width="2"/><text x="1060.0" y="223" font-size="19" fill="black" text-anchor="middle">_items[name]</text><text x="946" y="272" font-size="18" fill="black" text-anchor="start">1</text><text x="1194" y="272" font-size="18" fill="black" text-anchor="end">0..*</text>
<path d="M485 496 V735" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)"/>
<text x="510" y="640" font-size="20" fill="black" text-anchor="start">_state: current event handler</text>
<text x="510" y="715" font-size="18" fill="black" text-anchor="start">1</text>
<g><rect x="60" y="1135" width="350" height="134" fill="white" stroke="black" stroke-width="2"/><text x="235.0" y="1170" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">Idle</text><path d="M60 1187 H410" fill="none" stroke="black" stroke-width="2"/><text x="78" y="1217" font-size="20" fill="black" text-anchor="start">+ insert(m, coin)</text><text x="78" y="1247" font-size="20" fill="black" text-anchor="start">+ restock(m, name, count)</text></g>
<path d="M235.0 1135 V1065" fill="none" stroke="black" stroke-width="2"/>
<g><rect x="480" y="1135" width="350" height="164" fill="white" stroke="black" stroke-width="2"/><text x="655.0" y="1170" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">HasMoney</text><path d="M480 1187 H830" fill="none" stroke="black" stroke-width="2"/><text x="498" y="1217" font-size="20" fill="black" text-anchor="start">+ insert(m, coin)</text><text x="498" y="1247" font-size="20" fill="black" text-anchor="start">+ select(m, name)</text><text x="498" y="1277" font-size="20" fill="black" text-anchor="start">+ cancel(m)</text></g>
<path d="M655.0 1135 V1065" fill="none" stroke="black" stroke-width="2"/>
<g><rect x="900" y="1135" width="350" height="104" fill="white" stroke="black" stroke-width="2"/><text x="1075.0" y="1170" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">Dispensing</text><path d="M900 1187 H1250" fill="none" stroke="black" stroke-width="2"/><text x="918" y="1217" font-size="20" fill="black" text-anchor="start">+ dispense(m)</text></g>
<path d="M1075.0 1135 V1065" fill="none" stroke="black" stroke-width="2"/>
<g><rect x="1320" y="1135" width="380" height="104" fill="white" stroke="black" stroke-width="2"/><text x="1510.0" y="1170" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">SoldOut</text><path d="M1320 1187 H1700" fill="none" stroke="black" stroke-width="2"/><text x="1338" y="1217" font-size="20" fill="black" text-anchor="start">+ restock(m, name, count)</text></g>
<path d="M1510.0 1135 V1065" fill="none" stroke="black" stroke-width="2"/>
<path d="M235 1065 H1510" fill="none" stroke="black" stroke-width="2"/>
<path d="M485 1065 V959" fill="none" stroke="black" stroke-width="2" marker-end="url(#triangle)"/>
<text x="960" y="1035" font-size="20" fill="black" text-anchor="start">Only legal events are overridden.</text>
<g><path d="M1060 475 H1680 L1700 495 V782 H1060 Z M1680 475 V495 H1700" fill="white" stroke="black" stroke-width="2"/><text x="1080" y="510" font-size="23" fill="black" text-anchor="start" font-weight="bold">Ownership and sale boundary</text><text x="1080" y="545" font-size="20" fill="black" text-anchor="start">State is concrete; default methods reject events.</text><text x="1080" y="575" font-size="20" fill="black" text-anchor="start">Machine copies items and owns stored cash.</text><text x="1080" y="605" font-size="20" fill="black" text-anchor="start">_coins excludes the current payment.</text><text x="1080" y="635" font-size="20" fill="black" text-anchor="start">_inserted is refundable until a sale.</text><text x="1080" y="665" font-size="20" fill="black" text-anchor="start">select(): commit → dispense → return.</text><text x="1080" y="695" font-size="20" fill="black" text-anchor="start">Dispensing is internal to select().</text><text x="1080" y="725" font-size="20" fill="black" text-anchor="start">Sequential calls; dispensing always succeeds.</text><text x="1080" y="755" font-size="20" fill="black" text-anchor="start">No locks or hardware rollback.</text></g>
<path d="M1060 750 H990 V840 H910" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<g><path d="M60 1360 H1680 L1700 1380 V1487 H60 Z M1680 1360 V1380 H1700" fill="white" stroke="black" stroke-width="2"/><text x="80" y="1395" font-size="23" fill="black" text-anchor="start" font-weight="bold">Money flow</text><text x="80" y="1430" font-size="20" fill="black" text-anchor="start">Change planning uses stored and inserted coins without mutation; commit keeps available − change and clears payment.</text><text x="80" y="1460" font-size="20" fill="black" text-anchor="start">Bounded dynamic programming respects physical counts and returns a minimum-coin combination.</text></g>
<text x="880.0" y="1531" font-size="18" fill="black" text-anchor="middle">Filled diamond at owner: composition · Open arrow: navigable association · Hollow triangle: inheritance · Selected members</text>
</g>
</svg>

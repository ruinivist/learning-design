<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="895" viewBox="0 0 1500 895" role="img" aria-labelledby="title desc"><title id="title">2. Recency order</title><desc id="desc">LRU owns one doubly linked list, indexes real nodes by key, and the list references one circular sentinel root. Each node carries a key and neighbor links.</desc><defs>
<marker id="open" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="black" stroke-width="2"/></marker>
<marker id="call" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="black"/></marker>
<marker id="parent" markerWidth="22" markerHeight="22" refX="21" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L21 11 L1 21 Z" fill="white" stroke="black" stroke-width="2"/></marker>
<marker id="owns" markerWidth="26" markerHeight="16" refX="1" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 8 L13 1 L25 8 L13 15 Z" fill="black" stroke="black" stroke-width="2"/></marker>
</defs>
<style>text{font-family:'DejaVu Sans',sans-serif;font-size:20px;fill:black}.heading{font-size:31px;font-weight:bold}.name{font-size:25px;font-weight:bold}.small{font-size:18px}.logic{fill:#1856a6}.data{fill:#18713a}.contract{fill:#7435a0}.box{fill:white;stroke:black;stroke-width:2}.line{fill:none;stroke:black;stroke-width:2}</style><rect width="1500" height="895" fill="white"/><text x="750.0" y="55" class="heading" text-anchor="middle">2. Recency order</text><text x="750.0" y="98" class="small" text-anchor="middle"><tspan class="logic">Blue: logic</tspan> · <tspan class="data">Green: data / cache</tspan> · <tspan class="contract">Purple: contract</tspan></text><rect class="box" x="40" y="170" width="570" height="200"/><text x="325.0" y="210" class="name logic" text-anchor="middle">LRU&lt;K&gt;</text><path class="line" d="M40 232 H610"/><text x="58" y="266" class="" text-anchor="start">+ to_node: dict&lt;K, Node&gt;</text><path class="line" d="M40 284 H610"/><text x="58" y="318" class="" text-anchor="start">+ on_insert(key: K)</text><text x="58" y="348" class="" text-anchor="start">+ on_access(key: K)</text><rect class="box" x="880" y="170" width="580" height="230"/><text x="1170.0" y="210" class="name logic" text-anchor="middle">DLList</text><path class="line" d="M880 232 H1460"/><text x="898" y="266" class="" text-anchor="start">+ root: Node</text><path class="line" d="M880 284 H1460"/><text x="898" y="318" class="" text-anchor="start">+ push_front(node: Node)</text><text x="898" y="348" class="" text-anchor="start">+ delete(node: Node)</text><text x="898" y="378" class="" text-anchor="start">+ pop_back(): Node</text><path class="line" d="M610 285 H880" marker-start="url(#owns)"/><text x="744" y="257" class="" text-anchor="middle">list</text><text x="635" y="315" class="small" text-anchor="start">1</text><text x="850" y="315" class="small" text-anchor="start">1</text><rect class="box" x="880" y="545" width="580" height="174"/><text x="1170.0" y="585" class="name data" text-anchor="middle">Node</text><path class="line" d="M880 607 H1460"/><text x="898" y="641" class="" text-anchor="start">+ data: Any</text><text x="898" y="671" class="" text-anchor="start">+ prev: Node | None</text><text x="898" y="701" class="" text-anchor="start">+ next: Node | None</text><path class="line" d="M1170 400 V545" marker-end="url(#open)"/><text x="1190" y="477" class="" text-anchor="start">root</text><text x="1188" y="525" class="small" text-anchor="start">1</text><path class="line" d="M325 370 V645 H880" marker-end="url(#open)"/><text x="578" y="621" class="" text-anchor="middle">indexes keys → nodes</text><text x="818" y="675" class="small" text-anchor="start">0..*</text><text x="45" y="747" class="" text-anchor="start">Front: root.next · Back: root.prev</text><text x="45" y="782" class="" text-anchor="start">Empty: root.next = root.prev = root</text><text x="750" y="855" class="small" text-anchor="middle">Filled diamond: composition · open arrow: navigable association · selected members</text></svg>

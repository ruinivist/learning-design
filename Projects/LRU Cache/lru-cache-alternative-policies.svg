<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="965" viewBox="0 0 1500 965" role="img" aria-labelledby="title desc"><title id="title">4. Other eviction rules</title><desc id="desc">LFU and FIFO inherit the same eviction policy contract. LFU tracks key frequencies and buckets. FIFO tracks insertion order in a deque.</desc><defs>
<marker id="open" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="black" stroke-width="2"/></marker>
<marker id="call" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="black"/></marker>
<marker id="parent" markerWidth="22" markerHeight="22" refX="21" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L21 11 L1 21 Z" fill="white" stroke="black" stroke-width="2"/></marker>
<marker id="owns" markerWidth="26" markerHeight="16" refX="1" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 8 L13 1 L25 8 L13 15 Z" fill="black" stroke="black" stroke-width="2"/></marker>
</defs>
<style>text{font-family:'DejaVu Sans',sans-serif;font-size:20px;fill:black}.heading{font-size:31px;font-weight:bold}.name{font-size:25px;font-weight:bold}.small{font-size:18px}.logic{fill:#1856a6}.data{fill:#18713a}.contract{fill:#7435a0}.box{fill:white;stroke:black;stroke-width:2}.line{fill:none;stroke:black;stroke-width:2}</style><rect width="1500" height="965" fill="white"/><text x="750.0" y="55" class="heading" text-anchor="middle">4. Other eviction rules</text><text x="750.0" y="98" class="small" text-anchor="middle"><tspan class="logic">Blue: logic</tspan> · <tspan class="data">Green: data / cache</tspan> · <tspan class="contract">Purple: contract</tspan></text><rect class="box" x="450" y="165" width="600" height="206"/><text x="750.0" y="194" class="small contract" text-anchor="middle">«abstract»</text><text x="750.0" y="233" class="name contract" text-anchor="middle">EvictionPolicy&lt;K&gt;</text><path class="line" d="M450 255 H1050"/><text x="468" y="289" class="" text-anchor="start">+ on_access(key: K): None</text><text x="468" y="319" class="" text-anchor="start">+ on_insert(key: K): None</text><text x="468" y="349" class="" text-anchor="start">+ evict(): K</text><path class="line" d="M375 535 V450 H1125 V535"/><path class="line" d="M750 450 V371" marker-end="url(#parent)"/><rect class="box" x="45" y="535" width="660" height="174"/><text x="375.0" y="575" class="name logic" text-anchor="middle">LFU&lt;K&gt;</text><path class="line" d="M45 597 H705"/><text x="63" y="631" class="" text-anchor="start">+ min_freq: int</text><text x="63" y="661" class="" text-anchor="start">+ freqs: dict&lt;K, int&gt;</text><text x="63" y="691" class="" text-anchor="start">+ with_freqs: dict&lt;int, set&lt;K&gt;&gt;</text><rect class="box" x="795" y="535" width="660" height="114"/><text x="1125.0" y="575" class="name logic" text-anchor="middle">FIFO&lt;K&gt;</text><path class="line" d="M795 597 H1455"/><text x="813" y="631" class="" text-anchor="start">+ q: deque&lt;K&gt;</text><text x="65" y="785" class="" text-anchor="start">Insert: frequency 1; reset minimum.</text><text x="65" y="820" class="" text-anchor="start">Access: move key to frequency f + 1.</text><text x="65" y="855" class="" text-anchor="start">Evict: pop any key at min_freq.</text><text x="815" y="715" class="" text-anchor="start">Insert: append key.</text><text x="815" y="750" class="" text-anchor="start">Access: keep the order.</text><text x="815" y="785" class="" text-anchor="start">Evict: popleft().</text><text x="750" y="925" class="small" text-anchor="middle">Hollow triangle: inheritance · state fields shown; inherited hooks omitted</text></svg>

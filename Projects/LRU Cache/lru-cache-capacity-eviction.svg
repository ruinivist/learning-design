<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1075" viewBox="0 0 1500 1075" role="img" aria-labelledby="title desc"><title id="title">3. Capacity eviction</title><desc id="desc">A full-cache insertion synchronously evicts B from LRU metadata and storage before storing C and notifying the policy. LRU uses the list to remove its back node.</desc><defs>
<marker id="open" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="black" stroke-width="2"/></marker>
<marker id="call" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="black"/></marker>
<marker id="parent" markerWidth="22" markerHeight="22" refX="21" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L21 11 L1 21 Z" fill="white" stroke="black" stroke-width="2"/></marker>
<marker id="owns" markerWidth="26" markerHeight="16" refX="1" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 8 L13 1 L25 8 L13 15 Z" fill="black" stroke="black" stroke-width="2"/></marker>
</defs>
<style>text{font-family:'DejaVu Sans',sans-serif;font-size:20px;fill:black}.heading{font-size:31px;font-weight:bold}.name{font-size:25px;font-weight:bold}.small{font-size:18px}.logic{fill:#1856a6}.data{fill:#18713a}.contract{fill:#7435a0}.box{fill:white;stroke:black;stroke-width:2}.line{fill:none;stroke:black;stroke-width:2}</style><rect width="1500" height="1075" fill="white"/><text x="750.0" y="55" class="heading" text-anchor="middle">3. Capacity eviction</text><text x="750.0" y="98" class="small" text-anchor="middle"><tspan class="logic">Blue: logic</tspan> · <tspan class="data">Green: data / cache</tspan> · <tspan class="contract">Purple: contract</tspan></text><rect class="box" x="100" y="165" width="330" height="70"/><text x="265" y="208" class="name data" text-anchor="middle">cache: Cache</text><path class="line" d="M265 235 V940" stroke-dasharray="9 7"/><rect class="box" x="620" y="165" width="330" height="70"/><text x="785" y="208" class="name logic" text-anchor="middle">policy: LRU</text><path class="line" d="M785 235 V940" stroke-dasharray="9 7"/><rect class="box" x="1110" y="165" width="330" height="70"/><text x="1275" y="208" class="name logic" text-anchor="middle">list: DLList</text><path class="line" d="M1275 235 V940" stroke-dasharray="9 7"/><text x="750" y="135" class="small" text-anchor="middle">Before put("C", 3): store = {A, B}; recency = A, B (front to back)</text><rect class="box" x="257" y="260" width="16" height="650"/><rect class="box" x="777" y="300" width="16" height="250"/><rect class="box" x="1267" y="360" width="16" height="80"/><rect class="box" x="777" y="760" width="16" height="90"/><path class="line" d="M273 300 H777" marker-end="url(#call)"/><text x="525" y="280" class="" text-anchor="middle">evict()</text><path class="line" d="M793 360 H1267" marker-end="url(#call)"/><text x="1030" y="340" class="" text-anchor="middle">pop_back()</text><path class="line" d="M1267 440 H793" marker-end="url(#open)" stroke-dasharray="9 7"/><text x="1030" y="420" class="" text-anchor="middle">node for B</text><path class="line" d="M793 475 H860 V510 H793" marker-end="url(#call)"/><text x="885" y="490" class="" text-anchor="start">delete to_node["B"]</text><path class="line" d="M777 550 H273" marker-end="url(#open)" stroke-dasharray="9 7"/><text x="525" y="530" class="" text-anchor="middle">"B"</text><path class="line" d="M273 590 H350 V630 H273" marker-end="url(#call)"/><text x="375" y="610" class="" text-anchor="start">delete store["B"]</text><path class="line" d="M273 665 H350 V705 H273" marker-end="url(#call)"/><text x="375" y="685" class="" text-anchor="start">store["C"] = 3</text><path class="line" d="M273 760 H777" marker-end="url(#call)"/><text x="525" y="740" class="" text-anchor="middle">on_insert("C")</text><text x="835" y="810" class="small" text-anchor="start">Index new node; push it to front.</text><path class="line" d="M777 850 H273" marker-end="url(#open)" stroke-dasharray="9 7"/><text x="525" y="830" class="" text-anchor="middle">None</text><text x="750" y="985" class="" text-anchor="middle">After put returns None: store = {A, C}; recency = C, A</text><text x="750" y="1030" class="small" text-anchor="middle">Solid filled head: synchronous call · dashed open head: reply · time runs down</text></svg>

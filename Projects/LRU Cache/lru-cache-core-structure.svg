<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc"><title id="title">1. Cache boundary</title><desc id="desc">Cache stores values and references one injected eviction policy. The policy tracks keys and exposes three hooks.</desc><defs>

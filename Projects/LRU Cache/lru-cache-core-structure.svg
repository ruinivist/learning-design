<marker id="owns" markerWidth="26" markerHeight="16" refX="1" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 8 L13 1 L25 8 L13 15 Z" fill="black" stroke="black" stroke-width="2"/></marker>
</defs>
<style>text{font-family:'DejaVu Sans',sans-serif;font-size:20px;fill:black}.heading{font-size:31px;font-weight:bold}.name{font-size:25px;font-weight:bold}.small{font-size:18px}.logic{fill:#1856a6}.data{fill:#18713a}.contract{fill:#7435a0}.box{fill:white;stroke:black;stroke-width:2}.line{fill:none;stroke:black;stroke-width:2}</style><rect width="1500" height="620" fill="white"/><text x="750.0" y="55" class="heading" text-anchor="middle">1. Cache boundary</text><text x="750.0" y="98" class="small" text-anchor="middle"><tspan class="logic">Blue: logic</tspan> · <tspan class="data">Green: data / cache</tspan> · <tspan class="contract">Purple: contract</tspan></text><rect class="box" x="45" y="170" width="600" height="230"/><text x="345.0" y="210" class="name data" text-anchor="middle">Cache&lt;K: Hashable, V&gt;</text><path class="line" d="M45 232 H645"/><text x="63" y="266" class="" text-anchor="start">+ capacity: int</text><text x="63" y="296" class="" text-anchor="start">+ store: dict&lt;K, V&gt;</text><path class="line" d="M45 314 H645"/><text x="63" y="348" class="" text-anchor="start">+ get(key: K): V | None</text><text x="63" y="378" class="" text-anchor="start">+ put(key: K, value: V): None</text><rect class="box" x="870" y="170" width="600" height="206"/><text x="1170.0" y="199" class="small contract" text-anchor="middle">«abstract»</text><text x="1170.0" y="238" class="name contract" text-anchor="middle">EvictionPolicy&lt;K&gt;</text><path class="line" d="M870 260 H1470"/><text x="888" y="294" class="" text-anchor="start">+ on_access(key: K): None</text><text x="888" y="324" class="" text-anchor="start">+ on_insert(key: K): None</text><text x="888" y="354" class="" text-anchor="start">+ evict(): K</text><path class="line" d="M645 290 H870" marker-end="url(#open)"/><text x="756" y="260" class="" text-anchor="middle">policy</text><text x="840" y="320" class="small" text-anchor="start">1</text><text x="750" y="530" class="" text-anchor="middle">Values stay in Cache; policy metadata tracks the same keys.</text><text x="750" y="575" class="small" text-anchor="middle">Open arrow: navigable association · + public · selected members</text></svg>

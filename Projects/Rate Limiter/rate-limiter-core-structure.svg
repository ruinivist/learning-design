<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">Rate limiter: shared contract</title>
<desc id="desc">The limiter holds one supplied abstract policy. The policy returns a Decision. Selected members are shown.</desc>
<defs>
  <marker id="open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="2"/>
  </marker>
  <marker id="triangle" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M1 1 L18 10 L1 19 Z" fill="white" stroke="black" stroke-width="2"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="black">
<text x="750" y="43" font-size="31" fill="black" text-anchor="middle" font-weight="bold">Rate limiter: shared contract</text>
<text x="750" y="79" font-size="20" fill="black" text-anchor="middle">Blue: logic     Green: data/state     Purple: contract</text>
<g id="RateLimiter">
<rect x="60" y="140" width="610" height="140" fill="white" stroke="black" stroke-width="2"/>
<text x="365.0" y="175" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">RateLimiter</text>
<path d="M60 192 H670" fill="none" stroke="black" stroke-width="2"/>
<text x="78" y="222" font-size="20" fill="black" text-anchor="start">- _policy: RateLimitPolicy</text>
<path d="M60 236 H670" fill="none" stroke="black" stroke-width="2"/>
<text x="78" y="266" font-size="20" fill="black" text-anchor="start">+ check(client_id: str, endpoint: str): Decision</text>
</g>
<g id="RateLimitPolicy">
<rect x="820" y="140" width="610" height="168" fill="white" stroke="black" stroke-width="2"/>
<text x="1125.0" y="168" font-size="20" fill="#7435a0" text-anchor="middle">«abstract»</text>
<text x="1125.0" y="203" font-size="25" fill="#7435a0" text-anchor="middle" font-weight="bold">RateLimitPolicy</text>
<path d="M820 220 H1430" fill="none" stroke="black" stroke-width="2"/>
<text x="838" y="250" font-size="20" fill="black" text-anchor="start">+ active_keys: int {readOnly}</text>
<path d="M820 264 H1430" fill="none" stroke="black" stroke-width="2"/>
<text x="838" y="294" font-size="20" fill="black" text-anchor="start">+ check(client_id: str, endpoint: str): Decision</text>
</g>
<g id="Decision">
<rect x="820" y="470" width="610" height="156" fill="white" stroke="black" stroke-width="2"/>
<text x="1125.0" y="505" font-size="25" fill="#18713a" text-anchor="middle" font-weight="bold">Decision</text>
<path d="M820 522 H1430" fill="none" stroke="black" stroke-width="2"/>
<text x="838" y="552" font-size="20" fill="black" text-anchor="start">+ allowed: bool</text>
<text x="838" y="582" font-size="20" fill="black" text-anchor="start">+ remaining: int</text>
<text x="838" y="612" font-size="20" fill="black" text-anchor="start">+ reset_after_ms: int</text>
</g>
<path d="M670 220 H820" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)"/>
<text x="745" y="200" font-size="19" fill="black" text-anchor="middle">policy</text>
<text x="797" y="248" font-size="18" fill="black" text-anchor="start">1</text>
<path d="M1125 308 V470" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/>
<text x="1145" y="395" font-size="19" fill="black" text-anchor="start">returns</text>
<path d="M60 430 H646 L670 454 V550 H60 Z M646 430 V454 H670" fill="white" stroke="black" stroke-width="2"/>
<text x="78" y="465" font-size="20" fill="black" text-anchor="start">Caller supplies one configured policy.</text>
<text x="78" y="495" font-size="20" fill="black" text-anchor="start">Settings and key state belong to the policy.</text>
<text x="78" y="525" font-size="20" fill="black" text-anchor="start">Both algorithms return the same Decision.</text>
<path d="M365 430 V280" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<text x="750" y="735" font-size="18" fill="black" text-anchor="middle">Open V: reference     Dashed open V: dependency     Folded corner: note</text>
</g>
</svg>

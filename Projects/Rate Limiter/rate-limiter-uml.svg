<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1390" viewBox="0 0 1500 1390" role="img" aria-labelledby="title"><title id="title">Rate limiter UML class diagram with personal note colors</title><defs>
<marker id="open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="1.5"/></marker>
<marker id="triangle" markerWidth="17" markerHeight="17" refX="15" refY="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="white" stroke="black" stroke-width="1.3"/></marker>
</defs><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="DejaVu Sans, sans-serif"><text x="750" y="43" font-size="31" fill="black" text-anchor="middle" font-weight="bold">Rate limiter — UML class diagram</text><text x="750" y="77" font-size="21" fill="black" text-anchor="middle">Blue: logic     Green: data     Purple: contract</text><rect x="60" y="115" width="610" height="276" fill="white" stroke="black" stroke-width="2"/><text x="365.0" y="150" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">RateLimiter</text><path d="M60 167 H670" fill="none" stroke="black" stroke-width="2"/><text x="78" y="197" font-size="20" fill="black" text-anchor="start">- _policy: RateLimitPolicy</text><text x="78" y="227" font-size="20" fill="black" text-anchor="start">- _lock: Lock</text><text x="78" y="257" font-size="20" fill="black" text-anchor="start">- _total_allowed: int</text><text x="78" y="287" font-size="20" fill="black" text-anchor="start">- _total_rejected: int</text><path d="M60 309 H670" fill="none" stroke="black" stroke-width="2"/><text x="78" y="339" font-size="20" fill="black" text-anchor="start">+ check(client_id: str, endpoint: str): Decision</text><text x="78" y="369" font-size="20" fill="black" text-anchor="start">+ stats(): StatsDict</text><rect x="60" y="490" width="610" height="180" fill="white" stroke="black" stroke-width="2"/><text x="365.0" y="518" font-size="20" fill="#7435a0" text-anchor="middle">«abstract»</text><text x="365.0" y="547" font-size="25" fill="#7435a0" text-anchor="middle" font-weight="bold">RateLimitPolicy</text><path d="M60 566 H670" fill="none" stroke="black" stroke-width="2"/><text x="78" y="596" font-size="20" fill="black" text-anchor="start">+ active_keys: int {readOnly}</text><path d="M60 618 H670" fill="none" stroke="black" stroke-width="2"/><text x="78" y="648" font-size="20" fill="black" text-anchor="start">+ check(client_id: str, endpoint: str): Decision</text><rect x="1000" y="490" width="430" height="164" fill="white" stroke="black" stroke-width="2"/><text x="1215.0" y="525" font-size="25" fill="#18713a" text-anchor="middle" font-weight="bold">Decision</text><path d="M1000 542 H1430" fill="none" stroke="black" stroke-width="2"/><text x="1018" y="572" font-size="20" fill="black" text-anchor="start">+ allowed: bool</text><text x="1018" y="602" font-size="20" fill="black" text-anchor="start">+ remaining: int</text><text x="1018" y="632" font-size="20" fill="black" text-anchor="start">+ reset_after_ms: int</text><path d="M365 391 V490" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)"/><text x="385" y="452" font-size="19" fill="black" text-anchor="start">holds configured policy</text><text x="380" y="480" font-size="19" fill="black" text-anchor="start">1</text><path d="M670 565 H1000" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/><text x="835" y="549" font-size="20" fill="black" text-anchor="middle">returns</text><rect x="60" y="830" width="610" height="276" fill="white" stroke="black" stroke-width="2"/><text x="365.0" y="865" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">SlidingWindowPolicy</text><path d="M60 882 H670" fill="none" stroke="black" stroke-width="2"/><text x="78" y="912" font-size="20" fill="black" text-anchor="start">- _limit: int</text><text x="78" y="942" font-size="20" fill="black" text-anchor="start">- _window_ms: int</text><text x="78" y="972" font-size="20" fill="black" text-anchor="start">- _state: dict</text><text x="78" y="1002" font-size="20" fill="black" text-anchor="start">- _clock: Callable[[], int]</text><text x="78" y="1032" font-size="20" fill="black" text-anchor="start">+ active_keys: int {readOnly}</text><path d="M60 1054 H670" fill="none" stroke="black" stroke-width="2"/><text x="78" y="1084" font-size="20" fill="black" text-anchor="start">+ check(client_id: str, endpoint: str): Decision</text><rect x="820" y="830" width="610" height="276" fill="white" stroke="black" stroke-width="2"/><text x="1125.0" y="865" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">TokenBucketPolicy</text><path d="M820 882 H1430" fill="none" stroke="black" stroke-width="2"/><text x="838" y="912" font-size="20" fill="black" text-anchor="start">- _capacity: int</text><text x="838" y="942" font-size="20" fill="black" text-anchor="start">- _refill_rate: float</text><text x="838" y="972" font-size="20" fill="black" text-anchor="start">- _state: dict</text><text x="838" y="1002" font-size="20" fill="black" text-anchor="start">- _clock: Callable[[], int]</text><text x="838" y="1032" font-size="20" fill="black" text-anchor="start">+ active_keys: int {readOnly}</text><path d="M820 1054 H1430" fill="none" stroke="black" stroke-width="2"/><text x="838" y="1084" font-size="20" fill="black" text-anchor="start">+ check(client_id: str, endpoint: str): Decision</text><path d="M365 830 V755 H250 V670" fill="none" stroke="black" stroke-width="2" marker-end="url(#triangle)"/><path d="M1125 830 V735 H510 V670" fill="none" stroke="black" stroke-width="2" marker-end="url(#triangle)"/><text x="1160" y="785" font-size="19" fill="black" text-anchor="start">inherits</text><rect x="60" y="1200" width="610" height="104" fill="white" stroke="black" stroke-width="2"/><text x="365.0" y="1235" font-size="25" fill="#18713a" text-anchor="middle" font-weight="bold">SlidingWindowState</text><path d="M60 1252 H670" fill="none" stroke="black" stroke-width="2"/><text x="78" y="1282" font-size="20" fill="black" text-anchor="start">+ request_times: list[int]</text><rect x="820" y="1200" width="610" height="134" fill="white" stroke="black" stroke-width="2"/><text x="1125.0" y="1235" font-size="25" fill="#18713a" text-anchor="middle" font-weight="bold">TokenBucketState</text><path d="M820 1252 H1430" fill="none" stroke="black" stroke-width="2"/><text x="838" y="1282" font-size="20" fill="black" text-anchor="start">+ tokens: float</text><text x="838" y="1312" font-size="20" fill="black" text-anchor="start">+ last_refill_ms: int</text><path d="M365 1106 L375 1124 L365 1142 L355 1124 Z" fill="black" stroke="black" stroke-width="2"/><path d="M365 1142 V1200" fill="none" stroke="black" stroke-width="2"/><text x="388" y="1133" font-size="18" fill="black" text-anchor="start">1</text><text x="388" y="1185" font-size="18" fill="black" text-anchor="start">0..*</text><text x="425" y="1165" font-size="19" fill="black" text-anchor="start">owns state per key</text><path d="M1125 1106 L1135 1124 L1125 1142 L1115 1124 Z" fill="black" stroke="black" stroke-width="2"/><path d="M1125 1142 V1200" fill="none" stroke="black" stroke-width="2"/><text x="1148" y="1133" font-size="18" fill="black" text-anchor="start">1</text><text x="1148" y="1185" font-size="18" fill="black" text-anchor="start">0..*</text><text x="1185" y="1165" font-size="19" fill="black" text-anchor="start">owns state per key</text><path d="M940 135 H1405 L1430 160 V345 H940 Z M1405 135 V160 H1430" fill="white" stroke="black" stroke-width="2"/><text x="965" y="174" font-size="23" fill="black" text-anchor="start" font-weight="bold">Strategy pattern</text><text x="965" y="211" font-size="20" fill="black" text-anchor="start">One configured policy per limiter.</text><text x="965" y="247" font-size="20" fill="black" text-anchor="start">Policies inherit RateLimitPolicy.</text><text x="965" y="283" font-size="20" fill="black" text-anchor="start">Key = (client_id, endpoint)</text><text x="965" y="319" font-size="20" fill="black" text-anchor="start">Clock injected into each policy.</text><path d="M940 280 H780 V460 H670 V525" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/><text x="750" y="1365" font-size="20" fill="black" text-anchor="middle">Open arrow: association / dependency · Hollow triangle: inheritance · Filled diamond: composition</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">Rate limiter: locking and statistics</title>
<desc id="desc">The limiter owns one lock and two counters. Both check and stats use that lock. Stats returns a fresh StatsDict. Selected members are shown.</desc>
<defs>
  <marker id="open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="2"/>
  </marker>
  <marker id="triangle" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M1 1 L18 10 L1 19 Z" fill="white" stroke="black" stroke-width="2"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="black">
<text x="750" y="43" font-size="31" fill="black" text-anchor="middle" font-weight="bold">Rate limiter: locking and statistics</text>
<text x="750" y="79" font-size="20" fill="black" text-anchor="middle">Blue: logic     Green: data/state     Purple: contract</text>
<g id="RateLimiter">
<rect x="60" y="140" width="610" height="260" fill="white" stroke="black" stroke-width="2"/>
<text x="365.0" y="175" font-size="25" fill="#1856a6" text-anchor="middle" font-weight="bold">RateLimiter</text>
<path d="M60 192 H670" fill="none" stroke="black" stroke-width="2"/>
<text x="78" y="222" font-size="20" fill="black" text-anchor="start">- _policy: RateLimitPolicy</text>
<text x="78" y="252" font-size="20" fill="black" text-anchor="start">- _lock: Lock</text>
<text x="78" y="282" font-size="20" fill="black" text-anchor="start">- _total_allowed: int</text>
<text x="78" y="312" font-size="20" fill="black" text-anchor="start">- _total_rejected: int</text>
<path d="M60 326 H670" fill="none" stroke="black" stroke-width="2"/>
<text x="78" y="356" font-size="20" fill="black" text-anchor="start">+ check(client_id: str, endpoint: str): Decision</text>
<text x="78" y="386" font-size="20" fill="black" text-anchor="start">+ stats(): StatsDict</text>
</g>
<g id="StatsDict">
<rect x="820" y="140" width="610" height="186" fill="white" stroke="black" stroke-width="2"/>
<text x="1125.0" y="175" font-size="25" fill="#18713a" text-anchor="middle" font-weight="bold">StatsDict</text>
<path d="M820 192 H1430" fill="none" stroke="black" stroke-width="2"/>
<text x="838" y="222" font-size="20" fill="black" text-anchor="start">+ strategy: str</text>
<text x="838" y="252" font-size="20" fill="black" text-anchor="start">+ total_allowed: int</text>
<text x="838" y="282" font-size="20" fill="black" text-anchor="start">+ total_rejected: int</text>
<text x="838" y="312" font-size="20" fill="black" text-anchor="start">+ active_keys: int</text>
</g>
<path d="M670 390 H745 V244 H820" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open)"/>
<text x="745" y="220" font-size="19" fill="black" text-anchor="middle">returns</text>
<path d="M60 510 H646 L670 534 V630 H60 Z M646 510 V534 H670" fill="white" stroke="black" stroke-width="2"/>
<text x="78" y="545" font-size="20" fill="black" text-anchor="start">check(): lock → policy.check() → count → unlock</text>
<text x="78" y="575" font-size="20" fill="black" text-anchor="start">A policy exception skips the counter update.</text>
<text x="78" y="605" font-size="20" fill="black" text-anchor="start">stats() reads all values under the same lock.</text>
<path d="M365 510 V400" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<path d="M820 510 H1406 L1430 534 V630 H820 Z M1406 510 V534 H1430" fill="white" stroke="black" stroke-width="2"/>
<text x="838" y="545" font-size="20" fill="black" text-anchor="start">strategy = policy class name</text>
<text x="838" y="575" font-size="20" fill="black" text-anchor="start">active_keys = tracked keys, including idle keys</text>
<text x="838" y="605" font-size="20" fill="black" text-anchor="start">Return a fresh dictionary for each snapshot.</text>
<path d="M1125 510 V326" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<text x="750" y="735" font-size="18" fill="black" text-anchor="middle">Dashed open V: dependency     Folded corner: note</text>
</g>
</svg>

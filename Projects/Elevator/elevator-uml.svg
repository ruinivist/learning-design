<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180" role="img" aria-labelledby="title">
<title id="title">Elevator: UML class diagram</title>
<defs><marker id="open" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="black" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="black">
<text x="750" y="44" font-size="31" text-anchor="middle" fill="black" font-weight="bold">Elevator: UML class diagram</text>
<text x="750" y="80" font-size="20" text-anchor="middle" fill="black">Blue: logic     Green: data/state</text>
<rect x="50" y="130" width="760" height="181" fill="white" stroke="black" stroke-width="2"/>
<text x="430.0" y="168" font-size="25" text-anchor="middle" fill="#1856a6" font-weight="bold">ElevatorController</text>
<path d="M50 186 H810" fill="none" stroke="black" stroke-width="2"/>
<text x="68" y="215" font-size="20" text-anchor="start" fill="black">+ elevators: tuple[Elevator, ...]</text>
<path d="M50 227 H810" fill="none" stroke="black" stroke-width="2"/>
<text x="68" y="256" font-size="20" text-anchor="start" fill="black">+ request_elevator(floor: int, type: RequestType): bool</text>
<text x="68" y="287" font-size="20" text-anchor="start" fill="black">+ step(): None</text>
<rect x="50" y="450" width="760" height="243" fill="white" stroke="black" stroke-width="2"/>
<text x="430.0" y="488" font-size="25" text-anchor="middle" fill="#1856a6" font-weight="bold">Elevator</text>
<path d="M50 506 H810" fill="none" stroke="black" stroke-width="2"/>
<text x="68" y="535" font-size="20" text-anchor="start" fill="black">- _current_floor: int</text>
<text x="68" y="566" font-size="20" text-anchor="start" fill="black">- _direction: Direction</text>
<text x="68" y="597" font-size="20" text-anchor="start" fill="black">- _requests: set[Request]</text>
<path d="M50 609 H810" fill="none" stroke="black" stroke-width="2"/>
<text x="68" y="638" font-size="20" text-anchor="start" fill="black">+ add_request(request: Request): bool</text>
<text x="68" y="669" font-size="20" text-anchor="start" fill="black">+ step(): None</text>
<rect x="1000" y="450" width="450" height="207" fill="white" stroke="black" stroke-width="2"/>
<text x="1225.0" y="478" font-size="19" text-anchor="middle" fill="#18713a">«dataType» {readOnly}</text>
<text x="1225.0" y="514" font-size="25" text-anchor="middle" fill="#18713a" font-weight="bold">Request</text>
<path d="M1000 532 H1450" fill="none" stroke="black" stroke-width="2"/>
<text x="1018" y="561" font-size="20" text-anchor="start" fill="black">+ floor: int</text>
<text x="1018" y="592" font-size="20" text-anchor="start" fill="black">+ type: RequestType</text>
<path d="M1000 604 H1450" fill="none" stroke="black" stroke-width="2"/>
<text x="1018" y="633" font-size="20" text-anchor="start" fill="black">+ is_valid(): bool</text>
<rect x="50" y="890" width="760" height="191" fill="white" stroke="black" stroke-width="2"/>
<text x="430.0" y="918" font-size="19" text-anchor="middle" fill="#18713a">«enumeration»</text>
<text x="430.0" y="954" font-size="25" text-anchor="middle" fill="#18713a" font-weight="bold">Direction</text>
<path d="M50 972 H810" fill="none" stroke="black" stroke-width="2"/>
<text x="68" y="1001" font-size="20" text-anchor="start" fill="black">DOWN = -1</text>
<text x="68" y="1032" font-size="20" text-anchor="start" fill="black">IDLE = 0</text>
<text x="68" y="1063" font-size="20" text-anchor="start" fill="black">UP = 1</text>
<rect x="1000" y="890" width="450" height="191" fill="white" stroke="black" stroke-width="2"/>
<text x="1225.0" y="918" font-size="19" text-anchor="middle" fill="#18713a">«enumeration»</text>
<text x="1225.0" y="954" font-size="25" text-anchor="middle" fill="#18713a" font-weight="bold">RequestType</text>
<path d="M1000 972 H1450" fill="none" stroke="black" stroke-width="2"/>
<text x="1018" y="1001" font-size="20" text-anchor="start" fill="black">PICKUP_UP</text>
<text x="1018" y="1032" font-size="20" text-anchor="start" fill="black">PICKUP_DOWN</text>
<text x="1018" y="1063" font-size="20" text-anchor="start" fill="black">DESTINATION</text>
<path d="M430 311 L440 329 L430 347 L420 329 Z" fill="black" stroke="black" stroke-width="2"/>
<path d="M430 347 V450" fill="none" stroke="black" stroke-width="2"/>
<text x="453" y="339" font-size="19" text-anchor="start" fill="black">1</text>
<text x="453" y="434" font-size="19" text-anchor="start" fill="black">3</text>
<text x="475" y="398" font-size="20" text-anchor="start" fill="black">creates and owns</text>
<path d="M810 550 H1000" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)"/>
<text x="905" y="530" font-size="20" text-anchor="middle" fill="black">pending stops</text>
<text x="980" y="580" font-size="19" text-anchor="end" fill="black">0..*</text>
<path d="M430 693 V890" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)"/>
<text x="454" y="806" font-size="20" text-anchor="start" fill="black">direction</text>
<text x="454" y="876" font-size="19" text-anchor="start" fill="black">1</text>
<path d="M1225 657 V890" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)"/>
<text x="1249" y="796" font-size="20" text-anchor="start" fill="black">type</text>
<text x="1249" y="876" font-size="19" text-anchor="start" fill="black">1</text>
<path d="M930 130 H1428 L1450 152 V288 H930 Z M1428 130 V152 H1450" fill="white" stroke="black" stroke-width="2"/>
<text x="948" y="165" font-size="20" text-anchor="start" fill="black">One controller assigns work to three cars.</text>
<text x="948" y="197" font-size="20" text-anchor="start" fill="black">Each car owns movement and completion.</text>
<text x="948" y="229" font-size="20" text-anchor="start" fill="black">Position and direction are read-only.</text>
<text x="948" y="261" font-size="20" text-anchor="start" fill="black">requests returns an immutable set copy.</text>
<path d="M930 270 H870 V490 H810" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<text x="750" y="1148" font-size="20" text-anchor="middle" fill="black">Filled diamond: composition     Open arrow: association</text>
</g>
</svg>

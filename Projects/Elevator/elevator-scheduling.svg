<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title">
<title id="title">Elevator: movement and stop rules</title>
<defs><marker id="open" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="black" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="black">
<text x="750" y="44" font-size="31" text-anchor="middle" fill="black" font-weight="bold">Elevator: movement and stop rules</text>
<text x="750" y="80" font-size="20" text-anchor="middle" fill="black">Blue: logic     Green: data/state</text>
<rect x="50" y="160" width="650" height="212" fill="white" stroke="black" stroke-width="2"/>
<text x="375.0" y="198" font-size="25" text-anchor="middle" fill="#1856a6" font-weight="bold">Elevator</text>
<path d="M50 216 H700" fill="none" stroke="black" stroke-width="2"/>
<text x="68" y="245" font-size="20" text-anchor="start" fill="black">- _current_floor: int</text>
<text x="68" y="276" font-size="20" text-anchor="start" fill="black">- _direction: Direction</text>
<text x="68" y="307" font-size="20" text-anchor="start" fill="black">- _requests: set[Request]</text>
<path d="M50 319 H700" fill="none" stroke="black" stroke-width="2"/>
<text x="68" y="348" font-size="20" text-anchor="start" fill="black">+ step(): None</text>
<path d="M850 130 H1428 L1450 152 V288 H850 Z M1428 130 V152 H1450" fill="white" stroke="black" stroke-width="2"/>
<text x="868" y="165" font-size="20" text-anchor="start" fill="black">1. Empty: idle. Starting idle: nearest floor.</text>
<text x="868" y="197" font-size="20" text-anchor="start" fill="black">2. Matching stop here: serve and return.</text>
<text x="868" y="229" font-size="20" text-anchor="start" fill="black">3. Nothing ahead: reverse and return.</text>
<text x="868" y="261" font-size="20" text-anchor="start" fill="black">4. Otherwise: move one floor.</text>
<path d="M850 215 H780 V215 H700" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<path d="M850 380 H1428 L1450 402 V506 H850 Z M1428 380 V402 H1450" fill="white" stroke="black" stroke-width="2"/>
<text x="868" y="415" font-size="20" text-anchor="start" fill="black">Serve destinations and matching pickups.</text>
<text x="868" y="447" font-size="20" text-anchor="start" fill="black">Leave opposite-direction pickups pending.</text>
<text x="868" y="479" font-size="20" text-anchor="start" fill="black">All request types count as work ahead.</text>
<path d="M850 440 H800 V320 H700" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<path d="M50 550 H728 L750 572 V676 H50 Z M728 550 V572 H750" fill="white" stroke="black" stroke-width="2"/>
<text x="68" y="585" font-size="20" text-anchor="start" fill="black">One tick serves, reverses, or moves.</text>
<text x="68" y="617" font-size="20" text-anchor="start" fill="black">Arriving at a floor does not serve it yet.</text>
<text x="68" y="649" font-size="20" text-anchor="start" fill="black">No doors, timers, or worker threads.</text>
<path d="M375 550 V372" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<text x="1100" y="660" font-size="25" text-anchor="middle" fill="black" font-weight="bold">0 → 2 → 5 → 2</text>
<text x="1100" y="697" font-size="19" text-anchor="middle" fill="black">Pass 2 up; serve its down call on return.</text>
</g>
</svg>

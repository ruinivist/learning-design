<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title">
<title id="title">Elevator: multiple-car dispatch</title>
<defs><marker id="open" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="black" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="black">
<text x="750" y="44" font-size="31" text-anchor="middle" fill="black" font-weight="bold">Elevator: multiple-car dispatch</text>
<text x="750" y="80" font-size="20" text-anchor="middle" fill="black">Blue: logic     Green: data/state</text>
<rect x="50" y="150" width="760" height="181" fill="white" stroke="black" stroke-width="2"/>
<text x="430.0" y="188" font-size="25" text-anchor="middle" fill="#1856a6" font-weight="bold">ElevatorController</text>
<path d="M50 206 H810" fill="none" stroke="black" stroke-width="2"/>
<text x="68" y="235" font-size="20" text-anchor="start" fill="black">+ elevators: tuple[Elevator, ...]</text>
<path d="M50 247 H810" fill="none" stroke="black" stroke-width="2"/>
<text x="68" y="276" font-size="20" text-anchor="start" fill="black">+ request_elevator(floor: int, type: RequestType): bool</text>
<text x="68" y="307" font-size="20" text-anchor="start" fill="black">+ step(): None</text>
<rect x="1100" y="150" width="350" height="212" fill="white" stroke="black" stroke-width="2"/>
<text x="1275.0" y="188" font-size="25" text-anchor="middle" fill="#1856a6" font-weight="bold">Elevator</text>
<path d="M1100 206 H1450" fill="none" stroke="black" stroke-width="2"/>
<text x="1118" y="235" font-size="20" text-anchor="start" fill="black">+ current_floor: int {readOnly}</text>
<text x="1118" y="266" font-size="20" text-anchor="start" fill="black">+ direction: Direction</text>
<path d="M1100 278 H1450" fill="none" stroke="black" stroke-width="2"/>
<text x="1118" y="307" font-size="20" text-anchor="start" fill="black">+ add_request(req): bool</text>
<text x="1118" y="338" font-size="20" text-anchor="start" fill="black">+ step(): None</text>
<path d="M810 250 L828 240 L846 250 L828 260 Z" fill="black" stroke="black" stroke-width="2"/>
<path d="M846 250 H1100" fill="none" stroke="black" stroke-width="2"/>
<text x="973" y="230" font-size="20" text-anchor="middle" fill="black">owns</text>
<text x="850" y="280" font-size="19" text-anchor="start" fill="black">1</text>
<text x="1074" y="280" font-size="19" text-anchor="start" fill="black">3</text>
<path d="M60 470 H788 L810 492 V628 H60 Z M788 470 V492 H810" fill="white" stroke="black" stroke-width="2"/>
<text x="78" y="505" font-size="20" text-anchor="start" fill="black">Prefer cars approaching in the requested direction.</text>
<text x="78" y="537" font-size="20" text-anchor="start" fill="black">Otherwise choose an idle car, then any car.</text>
<text x="78" y="569" font-size="20" text-anchor="start" fill="black">Choose nearest within the group; ties use car order.</text>
<text x="78" y="601" font-size="20" text-anchor="start" fill="black">Pass the typed request to the chosen car.</text>
<path d="M430 470 V331" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<path d="M1040 470 H1428 L1450 492 V596 H1040 Z M1428 470 V492 H1450" fill="white" stroke="black" stroke-width="2"/>
<text x="1058" y="505" font-size="20" text-anchor="start" fill="black">Each car decides when to</text>
<text x="1058" y="537" font-size="20" text-anchor="start" fill="black">serve, reverse, or move.</text>
<text x="1058" y="569" font-size="20" text-anchor="start" fill="black">Controller step() ticks all cars.</text>
<path d="M1275 470 V362" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7"/>
<text x="750" y="710" font-size="20" text-anchor="middle" fill="black">Selected members; the controller assigns requests, and each car completes them.</text>
</g>
</svg>

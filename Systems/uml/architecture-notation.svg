<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1230" viewBox="0 0 1100 1230" role="img" aria-labelledby="title"><title id="title">UML component notation: provided and required interfaces, assembly, and dependencies</title><defs><marker id="open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="DejaVu Sans, sans-serif"><text x="40" y="45" font-size="25" text-anchor="start" font-weight="bold">COMPONENT DIAGRAM — software architecture</text><text x="40" y="85" font-size="19" text-anchor="start">Draw software units as rectangles labeled «component».</text><rect x="60" y="135" width="230" height="100" fill="white" stroke="black" stroke-width="2"/><text x="175.0" y="169" font-size="20" text-anchor="middle">«component»</text><text x="175.0" y="207" font-size="22" text-anchor="middle" font-weight="bold">JobsBroker</text><path d="M290 185 L434 185" fill="none" stroke="black" stroke-width="2"/><circle cx="450" cy="185" r="16" fill="white" stroke="black" stroke-width="2"/><text x="450" y="149" font-size="17" text-anchor="middle">JobSubmission</text><text x="550" y="174" font-size="21" text-anchor="start" font-weight="bold">Provided interface: circle (lollipop)</text><text x="550" y="207" font-size="18" text-anchor="start">The broker offers job submission.</text><rect x="60" y="310" width="230" height="100" fill="white" stroke="black" stroke-width="2"/><text x="175.0" y="344" font-size="20" text-anchor="middle">«component»</text><text x="175.0" y="382" font-size="22" text-anchor="middle" font-weight="bold">API</text><path d="M290 360 L425 360" fill="none" stroke="black" stroke-width="2"/><path d="M450 335 A25 25 0 0 0 450 385" fill="none" stroke="black" stroke-width="2"/><text x="450" y="324" font-size="17" text-anchor="middle">JobSubmission</text><text x="550" y="349" font-size="21" text-anchor="start" font-weight="bold">Required interface: semicircle (socket)</text><text x="550" y="382" font-size="18" text-anchor="start">The API needs job submission.</text><text x="40" y="460" font-size="22" text-anchor="start" font-weight="bold">ASSEMBLY — connect simple ports inside a component</text><rect x="40" y="500" width="1020" height="260" fill="white" stroke="black" stroke-width="2"/><text x="550" y="525" font-size="18" text-anchor="middle">«component»</text><text x="550" y="551" font-size="21" text-anchor="middle" font-weight="bold">JobSystem</text><path d="M40 565 L1060 565" fill="none" stroke="black" stroke-width="2"/><rect x="70" y="600" width="240" height="100" fill="white" stroke="black" stroke-width="2"/><text x="190.0" y="634" font-size="20" text-anchor="middle">«component»</text><text x="190.0" y="672" font-size="22" text-anchor="middle" font-weight="bold">api: API</text><rect x="770" y="600" width="270" height="100" fill="white" stroke="black" stroke-width="2"/><text x="905.0" y="634" font-size="20" text-anchor="middle">«component»</text><text x="905.0" y="672" font-size="22" text-anchor="middle" font-weight="bold">broker: JobsBroker</text><rect x="302" y="642" width="16" height="16" fill="white" stroke="black" stroke-width="2"/><rect x="762" y="642" width="16" height="16" fill="white" stroke="black" stroke-width="2"/><path d="M318 650 L525 650" fill="none" stroke="black" stroke-width="2"/><path d="M550 625 A25 25 0 0 0 550 675" fill="none" stroke="black" stroke-width="2"/><circle cx="550" cy="650" r="16" fill="white" stroke="black" stroke-width="2"/><path d="M566 650 L762 650" fill="none" stroke="black" stroke-width="2"/><text x="550" y="609" font-size="20" text-anchor="middle">JobSubmission</text><text x="190" y="735" font-size="18" text-anchor="middle">requires</text><text x="905" y="735" font-size="18" text-anchor="middle">provides</text><text x="40" y="800" font-size="18" text-anchor="start">Small boundary squares are ports; api and broker are parts of JobSystem.</text><text x="40" y="845" font-size="22" text-anchor="start" font-weight="bold">DEPENDENCY — a simpler view when interfaces add no useful detail</text><rect x="60" y="900" width="250" height="100" fill="white" stroke="black" stroke-width="2"/><text x="185.0" y="934" font-size="20" text-anchor="middle">«component»</text><text x="185.0" y="972" font-size="22" text-anchor="middle" font-weight="bold">Worker</text><rect x="760" y="900" width="280" height="100" fill="white" stroke="black" stroke-width="2"/><text x="900.0" y="934" font-size="20" text-anchor="middle">«component»</text><text x="900.0" y="972" font-size="22" text-anchor="middle" font-weight="bold">JobsBroker</text><path d="M310 950 L760 950" fill="none" stroke="black" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open)"/><text x="535" y="926" font-size="18" text-anchor="middle">uses job consumption</text><rect x="60" y="1050" width="250" height="100" fill="white" stroke="black" stroke-width="2"/><text x="185.0" y="1084" font-size="20" text-anchor="middle">«component»</text><text x="185.0" y="1122" font-size="22" text-anchor="middle" font-weight="bold">API</text><rect x="760" y="1050" width="280" height="100" fill="white" stroke="black" stroke-width="2"/><text x="900.0" y="1084" font-size="20" text-anchor="middle">«component»</text><text x="900.0" y="1122" font-size="22" text-anchor="middle" font-weight="bold">PostgreSQL</text><path d="M310 1100 L760 1100" fill="none" stroke="black" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open)"/><text x="535" y="1076" font-size="18" text-anchor="middle">uses SQL access</text><text x="40" y="1200" font-size="19" text-anchor="start">Dashed arrow points from user to supplier. It does not specify sync or async.</text></g></svg>
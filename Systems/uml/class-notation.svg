<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320" role="img" aria-labelledby="title"><title id="title">UML class notation: classifiers, relationships, and multiplicity</title><defs>
<marker id="open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="1.5" /></marker>
<marker id="filled" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12 Z" fill="black" /></marker>
<marker id="triangle" markerWidth="17" markerHeight="17" refX="15" refY="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="white" stroke="black" stroke-width="1.3" /></marker>
</defs><rect width="100%" height="100%" fill="white" /><g fill="black" font-family="DejaVu Sans, sans-serif"><text x="40" y="45" font-size="25" text-anchor="start" font-weight="bold">CLASS DIAGRAM — structure, not execution order</text><rect x="40" y="80" width="545" height="185" fill="white" stroke="black" stroke-width="2" /><path d="M40 130 L585 130" fill="none" stroke="black" stroke-width="2" /><path d="M40 185 L585 185" fill="none" stroke="black" stroke-width="2" /><text x="312" y="113" font-size="22" text-anchor="middle" font-weight="bold">RateLimiter</text><text x="58" y="164" font-size="19" text-anchor="start">- _policy: RateLimitPolicy</text><text x="58" y="217" font-size="19" text-anchor="start">+ check(client_id: str,</text><text x="80" y="245" font-size="19" text-anchor="start">endpoint: str): Decision</text><text x="635" y="113" font-size="19" text-anchor="start">1. Class name</text><text x="635" y="164" font-size="19" text-anchor="start">2. Stored data: type</text><text x="635" y="232" font-size="19" text-anchor="start">3. Operation: parameters and return type</text><text x="40" y="305" font-size="19" text-anchor="start">+ public     - private     # protected     ~ package</text><text x="40" y="350" font-size="20" text-anchor="start" font-weight="bold">Relationship</text><text x="590" y="350" font-size="20" text-anchor="start" font-weight="bold">Meaning / code mapping</text><rect x="40" y="383" width="190" height="64" fill="white" stroke="black" stroke-width="2" /><rect x="370" y="383" width="190" height="64" fill="white" stroke="black" stroke-width="2" /><text x="135" y="421" font-size="16" text-anchor="middle" font-weight="bold">RateLimiter</text><text x="465" y="432" font-size="16" text-anchor="middle" font-weight="bold">RateLimitPolicy</text><path d="M230 415 L370 415" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)" /><text x="590" y="407" font-size="19" text-anchor="start" font-weight="bold">Association: holds a reference</text><text x="590" y="437" font-size="18" text-anchor="start">self._policy = policy</text><rect x="40" y="513" width="190" height="64" fill="white" stroke="black" stroke-width="2" /><rect x="370" y="513" width="190" height="64" fill="white" stroke="black" stroke-width="2" /><text x="135" y="562" font-size="16" text-anchor="middle" font-weight="bold">RateLimitPolicy</text><text x="465" y="551" font-size="16" text-anchor="middle" font-weight="bold">Decision</text><path d="M230 545 L370 545" fill="none" stroke="black" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open)" /><text x="590" y="537" font-size="19" text-anchor="start" font-weight="bold">Dependency: uses the other type</text><text x="590" y="567" font-size="18" text-anchor="start">check returns Decision</text><rect x="40" y="643" width="190" height="64" fill="white" stroke="black" stroke-width="2" /><rect x="370" y="643" width="190" height="64" fill="white" stroke="black" stroke-width="2" /><text x="135" y="681" font-size="16" text-anchor="middle" font-weight="bold">Child</text><text x="465" y="681" font-size="16" text-anchor="middle" font-weight="bold">Parent</text><path d="M230 675 L370 675" fill="none" stroke="black" stroke-width="2" marker-end="url(#triangle)" /><text x="590" y="667" font-size="19" text-anchor="start" font-weight="bold">Generalization: specializes a parent</text><text x="590" y="697" font-size="18" text-anchor="start">Python: class Child(Parent)</text><rect x="40" y="773" width="190" height="64" fill="white" stroke="black" stroke-width="2" /><rect x="370" y="773" width="190" height="64" fill="white" stroke="black" stroke-width="2" /><text x="135" y="811" font-size="15" text-anchor="middle" font-weight="bold">SlidingWindowPolicy</text><text x="465" y="799" font-size="16" text-anchor="middle">«interface»</text><text x="465" y="822" font-size="16" text-anchor="middle" font-weight="bold">RateLimitPolicy</text><path d="M230 805 L370 805" fill="none" stroke="black" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#triangle)" /><text x="590" y="797" font-size="19" text-anchor="start" font-weight="bold">Realization: fulfills a contract</text><text x="590" y="827" font-size="18" text-anchor="start">Provides check() and active_keys</text><rect x="40" y="903" width="190" height="64" fill="white" stroke="black" stroke-width="2" /><rect x="370" y="903" width="190" height="64" fill="white" stroke="black" stroke-width="2" /><text x="135" y="941" font-size="16" text-anchor="middle" font-weight="bold">Policy</text><text x="465" y="941" font-size="16" text-anchor="middle" font-weight="bold">State</text><path d="M230 935 L248 925 L266 935 L248 945 Z" fill="black" stroke="black" stroke-width="2" /><path d="M266 935 L370 935" fill="none" stroke="black" stroke-width="2" /><text x="590" y="927" font-size="19" text-anchor="start" font-weight="bold">Composition: owns its parts</text><text x="590" y="957" font-size="18" text-anchor="start">Each state belongs to one policy</text><text x="277" y="919" font-size="17" text-anchor="start">1</text><text x="324" y="919" font-size="17" text-anchor="start">0..*</text><rect x="40" y="1033" width="190" height="64" fill="white" stroke="black" stroke-width="2" /><rect x="370" y="1033" width="190" height="64" fill="white" stroke="black" stroke-width="2" /><text x="135" y="1071" font-size="16" text-anchor="middle" font-weight="bold">Group</text><text x="465" y="1071" font-size="16" text-anchor="middle" font-weight="bold">Member</text><path d="M230 1065 L248 1055 L266 1065 L248 1075 Z" fill="white" stroke="black" stroke-width="2" /><path d="M266 1065 L370 1065" fill="none" stroke="black" stroke-width="2" /><text x="590" y="1057" font-size="19" text-anchor="start" font-weight="bold">Shared aggregation: groups parts</text><text x="590" y="1087" font-size="18" text-anchor="start">Precise meaning is model-dependent</text><text x="40" y="1140" font-size="19" text-anchor="start" font-weight="bold">Triangle points to parent/interface. Diamond touches the whole.</text><text x="40" y="1180" font-size="18" text-anchor="start">Multiplicity: 1 exactly one · 0..1 optional · 0..* any number · 1..* one or more</text><text x="40" y="1220" font-size="18" text-anchor="start">Deleting a composite whole deletes the parts still owned by it.</text><text x="40" y="1260" font-size="18" text-anchor="start">Use a plain association unless the stronger ownership meaning is needed.</text><text x="465" y="409" font-size="16" text-anchor="middle">«interface»</text><text x="135" y="539" font-size="16" text-anchor="middle">«interface»</text></g></svg>
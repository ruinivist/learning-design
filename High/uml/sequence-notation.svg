<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100" role="img" aria-labelledby="title"><title id="title">UML sequence messages and rate limiter request flow</title><defs>
<marker id="open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="1.5" /></marker>
<marker id="filled" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2 2 L12 7 L2 12 Z" fill="black" /></marker>
<marker id="triangle" markerWidth="17" markerHeight="17" refX="15" refY="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="white" stroke="black" stroke-width="1.3" /></marker>
</defs><rect width="100%" height="100%" fill="white" /><g fill="black" font-family="DejaVu Sans, sans-serif"><text x="40" y="45" font-size="25" text-anchor="start" font-weight="bold">SEQUENCE DIAGRAM — time goes downward</text><text x="70" y="105" font-size="18" text-anchor="start">Sender</text><text x="370" y="105" font-size="18" text-anchor="start">Receiver</text><path d="M95 130 L410 130" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)" /><text x="475" y="122" font-size="21" text-anchor="start" font-weight="bold">Synchronous call</text><text x="475" y="154" font-size="17" text-anchor="start">Solid line + filled head: caller waits for completion.</text><text x="70" y="230" font-size="18" text-anchor="start">Sender</text><text x="370" y="230" font-size="18" text-anchor="start">Receiver</text><path d="M95 255 L410 255" fill="none" stroke="black" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open)" /><text x="475" y="247" font-size="21" text-anchor="start" font-weight="bold">Reply (open-head variant)</text><text x="475" y="279" font-size="17" text-anchor="start">Dashed line + open or filled head: reply.</text><text x="70" y="355" font-size="18" text-anchor="start">Sender</text><text x="370" y="355" font-size="18" text-anchor="start">Receiver</text><path d="M95 380 L410 380" fill="none" stroke="black" stroke-width="2" marker-end="url(#open)" /><text x="475" y="372" font-size="21" text-anchor="start" font-weight="bold">Asynchronous message</text><text x="475" y="404" font-size="17" text-anchor="start">Solid line + open head: sender proceeds without waiting.</text><text x="40" y="455" font-size="19" text-anchor="start" font-weight="bold">Dashed does NOT mean async. Open V and hollow triangle are different shapes.</text><text x="40" y="515" font-size="22" text-anchor="start" font-weight="bold">Example: one rate limiter request</text><rect x="55" y="550" width="190" height="55" fill="white" stroke="black" stroke-width="2" /><text x="150" y="585" font-size="21" text-anchor="middle" font-weight="bold">Caller</text><path d="M150 605 L150 1005" fill="none" stroke="black" stroke-width="2" stroke-dasharray="8 6" /><rect x="405" y="550" width="190" height="55" fill="white" stroke="black" stroke-width="2" /><text x="500" y="585" font-size="21" text-anchor="middle" font-weight="bold">RateLimiter</text><path d="M500 605 L500 1005" fill="none" stroke="black" stroke-width="2" stroke-dasharray="8 6" /><rect x="805" y="550" width="190" height="55" fill="white" stroke="black" stroke-width="2" /><text x="900" y="585" font-size="21" text-anchor="middle" font-weight="bold">Policy</text><path d="M900 605 L900 1005" fill="none" stroke="black" stroke-width="2" stroke-dasharray="8 6" /><rect x="492" y="650" width="16" height="320" fill="white" stroke="black" stroke-width="2" /><path d="M150 650 L492 650" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)" /><text x="290" y="634" font-size="18" text-anchor="middle">check</text><path d="M508 740 L900 740" fill="none" stroke="black" stroke-width="2" marker-end="url(#filled)" /><text x="700" y="724" font-size="18" text-anchor="middle">check</text><path d="M900 805 L508 805" fill="none" stroke="black" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open)" /><text x="700" y="789" font-size="18" text-anchor="middle">check: decision</text><path d="M492 960 L150 960" fill="none" stroke="black" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open)" /><text x="310" y="943" font-size="18" text-anchor="middle">check: decision</text><text x="40" y="1055" font-size="18" text-anchor="start">Vertical dashed lines are lifelines. The narrow bar is an activation (handling a call).</text><path d="M550 665 H781 L795 679 V705 H550 Z M781 665 V679 H795" fill="white" stroke="black" stroke-width="1.5" /><path d="M508 685.0 H550" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="5 4" /><text x="562" y="692" font-size="18">Acquire lock</text><path d="M550 835 H816 L830 849 V910 H550 Z M816 835 V849 H830" fill="white" stroke="black" stroke-width="1.5" /><path d="M508 872.5 H550" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="5 4" /><text x="562" y="862" font-size="18">Update statistics</text><text x="562" y="889" font-size="18">Release lock</text></g></svg>